<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paul Perth Library</title>
<meta name="description" content="คลังชิ้นส่วนกลางสำหรับทุกเกมของ Paul Perth: โมเดล ฉาก ภูมิประเทศ ระบบ เสียง และแบรนด์">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#10171d;--panel:#18222b;--line:#2a3743;--ink:#f3efe6;--mut:#9fb0bb;--gold:#ffcf5a;--ok:#7fd36a;--plan:#6f8494}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Kanit,system-ui,sans-serif}
header{padding:18px 20px 8px}
h1{margin:0;font:800 26px Kanit}h1 span{color:var(--gold)}
header p{margin:4px 0 0;color:var(--mut);font-size:14px}
.wrap{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:14px;padding:10px 20px 24px}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:10px 12px}}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;max-height:calc(100vh - 120px);overflow:auto}
@media (max-width:820px){.list{max-height:none;order:2}}
.grp{margin:10px 6px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.it{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.it:hover{background:#202c36}.it.sel{background:#263542}
.dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--plan)}.ready .dot{background:var(--ok)}
.it b{font-weight:600;font-size:14px}.it small{display:block;color:var(--mut);font-size:12px}
.stage{position:relative;background:#0c1116;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:420px;height:calc(100vh - 120px)}
@media (max-width:820px){.stage{height:62vh}}
canvas{display:block;width:100%;height:100%}
.info{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.card{background:rgba(16,23,29,.7);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px);pointer-events:auto}
.card h2{margin:0;font:600 18px Kanit}.card p{margin:2px 0 0;color:var(--mut);font-size:13px;max-width:52ch}
.ctl{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
.ctl button{font:600 13px Kanit;color:var(--ink);background:rgba(16,23,29,.75);border:1px solid var(--line);border-radius:20px;padding:6px 11px;cursor:pointer}
.ctl button.on{border-color:var(--gold);color:var(--gold)}
.stat{display:flex;gap:14px;font-size:13px;color:var(--mut)}.stat b{color:var(--ink)}
code{background:#0c1116;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px}
a{color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>Paul Perth <span>Library</span></h1>
  <p>คลังชิ้นส่วนกลางที่ทุกเกมเรียกใช้ร่วมกัน · <span id="count"></span></p>
</header>
<div class="wrap">
  <nav class="list" id="list"></nav>
  <section class="stage">
    <canvas id="c"></canvas>
    <div class="info"><div class="card"><h2 id="tName">เลือกชิ้นส่วน</h2><p id="tDesc"></p></div>
      <div class="card stat" id="stat"></div></div>
    <div class="ctl" id="ctl"></div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="core/kit.js"></script>
<script src="models/fauna/kangaroo.js"></script>
<script src="models/fauna/magpie.js"></script>
<script src="models/flora/aussie-flora.js"></script>
<script src="models/flora/lowpoly-garden.js"></script>
<script src="models/people/golfer.js"></script>
<script src="models/people/human.js"></script>
<script src="models/people/golfer-human.js"></script>
<script src="models/props/golf-props.js"></script>
<script src="models/vehicles/retro-hatch.js"></script>
<script src="models/vehicles/rrr-cars.js"></script>
<script src="models/vehicles/jet-plane.js"></script>
<script src="models/props/freeway-sign.js"></script>
<script src="models/props/picket-fence.js"></script>
<script src="models/props/fountain.js"></script>
<script src="models/buildings/verandah-shop.js"></script>
<script src="env/sky-weather.js"></script>
<script>
(async function(){
const P = PPL, $ = id => document.getElementById(id);
const cat = await fetch('catalog.json').then(r => r.json());
const GN = { 'core': 'พื้นฐาน', 'models/fauna': 'สัตว์', 'models/flora': 'ต้นไม้ พืช หิน', 'models/people': 'คน', 'models/vehicles': 'รถ', 'models/buildings': 'อาคาร', 'scenes': 'ฉากเต็ม', 'models/props': 'ของประกอบฉาก', 'env': 'ท้องฟ้า แสง อากาศ น้ำ', 'terrain': 'ภูมิประเทศ', 'systems': 'ระบบเกม', 'audio': 'เสียงและเพลง', 'brand': 'แบรนด์' };
const ready = cat.items.filter(i => i.status === 'ready').length;
$('count').textContent = `พร้อมใช้ ${ready} · รอย้ายจากเกมเดิม ${cat.items.length - ready} · v${cat.version}`;

/* stage */
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40, 1, .05, 6000);
const W = P.skyWeather(scene, renderer, { radius: 3000, shadowSize: 12, shadowRes: 1024 }); W.set({ hour: 16.2, weather: 'clear' });
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: P.lin('#7d8a55'), roughness: .95, map: P.detailTex() }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; P.detailTex().repeat.set(20, 20); scene.add(ground);
const holder = new THREE.Group(); scene.add(holder);
function resize(){ const r = $('c').getBoundingClientRect(); renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* how to preview each ready item */
let anim = null, frame = { dist: 6, h: 1.2, look: .8 };
const geoItem = (fn, seeds, dist, h, look) => () => { seeds.forEach((s, i) => { const m = new THREE.Mesh(fn(s), P.vmat({ roughness: .9 })); m.castShadow = true; m.position.x = (i - (seeds.length - 1) / 2) * dist / 2.2; holder.add(m); }); frame = { dist, h, look }; };
const PREV = {
  kangaroo: () => { const poses = ['stand', 'graze', 'lie']; poses.forEach((p, i) => { const r = P.kangaroo({ pose: p, seed: i + 2 }); r.position.x = (i - 1) * 1.6; r.rotation.y = .6; holder.add(r); }); frame = { dist: 6, h: 1.6, look: .6 };
    anim = (t, dt) => holder.children.forEach(r => P.kangarooTick(r, dt)); return 'ยืน / กินหญ้า / นอน · มีท่ากระโดดหนี'; },
  magpie: () => { const m = P.magpie(); m.position.y = 1; m.scale.setScalar(2); holder.add(m); frame = { dist: 3.2, h: 1.4, look: 1 }; anim = t => { m.userData.flap(t, .6 + .4 * Math.sin(t)); m.position.y = 1 + Math.sin(t * 2) * .1; }; return 'กระพือปีก / หุบปีก'; },
  'aussie-flora': () => { [[P.gumGeo, 11, -9], [P.peppermintGeo, 1, -2], [P.grassTreeGeo, 21, 3], [P.heathGeo, 31, 5], [P.tussockGeo, 41, 6.5], [P.boulderGeo, 51, 8.5]].forEach(([f, s, x]) => { const m = new THREE.Mesh(f(s), P.vmat({ roughness: .9 })); m.position.x = x; m.castShadow = true; holder.add(m); }); frame = { dist: 26, h: 6, look: 3 }; return 'ยูคาลิปตัส · เปปเปอร์มินต์ WA · หญ้าต้น · พุ่มชายฝั่ง · หญ้ากอ · หินแกรนิต'; },
  'lowpoly-garden': () => { const ids = Object.keys(P.LP_GARDEN); ids.forEach((id, i) => { const m = P.lpGarden(id, { seed: 7 + i }); const big = /pine|round-tree/.test(id); m.position.set((i % 6 - 2.5) * 2.2, 0, (Math.floor(i / 6) - 2) * 2.2); m.scale.setScalar(big ? .55 : 1); holder.add(m); }); frame = { dist: 15, h: 9, look: 0 }; return 'พืช low-poly 30 แบบ: เฟิร์น บัว เถาวัลย์ ไอวี่ กก เดซี่ แปลงดอกไม้ ลาเวนเดอร์ สน ต้นพุ่มกลม รั้วต้นไม้ พุ่มดอก · ใช้ P.lpGarden(id)'; },
  golfer: () => { const g = P.golfer({ shirt: '#f3f1ea', pants: '#2b3a55', cap: '#1f6f8b' }); g.rotation.y = -Math.PI / 2; holder.add(g); const b = P.golfBall(); b.scale.setScalar(2); holder.add(b);
    frame = { dist: 4.2, h: 1.3, look: .9 }; const clubs = ['driver', 'iron', 'wedge', 'putter']; let k = 0;
    anim = (t) => { const ph = (t % 2.6) / 2.6; if (ph < .02) { g.userData.setClub(clubs[k++ % 4]); } g.userData.swing(Math.min(1, ph * 1.25)); }; return 'วงสวิงครบ 4 ไม้ ไดรเวอร์ เหล็ก เวดจ์ พัตเตอร์'; },
  'golf-props': () => { const f = P.flagPin(); holder.add(f); const t = P.teeMarkers(); t.position.z = 2; holder.add(t); frame = { dist: 6, h: 1.4, look: 1 }; anim = (tt) => f.userData.tick(tt, .8); return 'ธงพร้อมหลุม · ที่ตั้งที · ลูกกอล์ฟ · เส้นทางลูก'; },
  'sky-weather': () => { const r = P.kangaroo({ pose: 'graze' }); holder.add(r); [[-6, -8], [5, -10], [-3, 9]].forEach(([x, z], i) => { const m = new THREE.Mesh(P.peppermintGeo(i + 1), P.vmat()); m.position.set(x, 0, z); m.castShadow = true; holder.add(m); });
    frame = { dist: 16, h: 2.5, look: 3 }; showWx = true; return 'ลองกดเปลี่ยนเวลาและสภาพอากาศด้านล่าง'; },
  human: () => { frame = { dist: 5.2, h: 1.5, look: .95 }; const tok = holder.uuid;
    PPL.human.base = 'assets/characters/';
    Promise.all([PPL.human.load('m'), PPL.human.load('f')]).then(([m, f]) => { if (holder.uuid !== tok || holder.children.length) return;
      const people = [m.make({ shirt: '#f3f1ea', pants: '#2b3a55' }), f.make({ shirt: '#e86a8a', pants: '#efe9dc', hair: '#5a3a24' }), m.make({ shirt: '#2f6f9f', pants: '#d8cfb4', skin: .72, beard: true, hair: '#1a1410' })];
      const clips = ['Idle_Loop', 'Walk_Loop', 'Yes']; people.forEach((p, i) => { p.position.x = (i - 1) * 1.1; p.rotation.y = .3; holder.add(p); p.userData.play(clips[i]); });
      anim = (t, dt) => people.forEach(p => p.userData.update(dt)); });
    return 'ชาย/หญิง เปลี่ยนสีเสื้อ กางเกง ผม สีผิว มีเครา · 12 ท่า: ยืน เดิน วิ่ง ดีใจ ส่ายหัว นั่ง ขับรถ คุยโทรศัพท์ เต้น'; },
  'golfer-human': () => { frame = { dist: 4.4, h: 1.4, look: .9 }; PPL.human.base = 'assets/characters/';
    PPL.human.load('m').then(m => { if (holder.children.length) return; const g = PPL.golferHuman(m, {}); g.rotation.y = -Math.PI / 2; holder.add(g); const b = PPL.golfBall(); b.scale.setScalar(2); holder.add(b);
      const clubs = ['driver', 'iron', 'wedge', 'putter']; let k = 0, lastPh = 1;
      anim = t => { const ph = (t % 2.6) / 2.6; if (ph < lastPh) g.userData.setClub(clubs[k++ % 4]); lastPh = ph; g.userData.swing(Math.min(1, ph * 1.2));
        const h = new THREE.Vector3(); if (ph < .02) { g.userData.swing(0); g.userData.clubHead.getWorldPosition(h); b.position.set(h.x, .045, h.z); } }; });
    return 'วงสวิงด้วย IK บนตัวละครสมจริง เปลี่ยนไม้ทุกรอบ'; },
  'rrr-cars': () => { Object.keys(P.RRR_CARS).forEach((k, i) => { const m = P.rrrCar(k); m.scale.setScalar(.36); m.position.set((i - 2.5) * 2.1, 0, 0); m.rotation.y = 2.4; holder.add(m); }); frame = { dist: 11, h: 2.4, look: .4 }; return 'กระบะ V8 · 4x4 · ไฮบริด · แฮทช์ · แคมเปอร์ · SUV · ใช้ใน Roo Road Rescue และร้านรถใน Quokka Cafe'; },
  'retro-hatch': () => { P.RETRO_COLOURS.slice(0, 5).forEach((c, i) => { const m = P.retroHatch({ body: c }); m.position.set((i - 2) * 1.5, 0, 0); m.rotation.y = .6; holder.add(m); }); frame = { dist: 10, h: 2.2, look: .4 }; return 'ห้าสี สองโทน หลังคาตัดสี · ใช้ใน Quokka Cafe (Fremantle, CBD, สนามบิน)'; },
  'jet-plane': () => { const a = P.jetPlane({ tail: '#2a9a8a' }); a.rotation.y = .7; holder.add(a); frame = { dist: 16, h: 4, look: 1.2 }; return 'เครื่องบินลำตัวแคบ สายการบินสมมติ เปลี่ยนสีหางได้'; },
  'freeway-sign': () => { const g = P.freewaySign({ route: '30', road: 'ALBANY HWY', to: [['Perth Airport', 10], ['Armadale', 26], ['Albany', 405]], strip: 'WORLD MAP →' }); holder.add(g); frame = { dist: 5.5, h: 2, look: 2 }; return 'ใส่หมายเลข ชื่อถนน เมือง และ กม. เองได้'; },
  'picket-fence': () => { holder.add(P.picketFence([[-4, 0], [3, 0], [4, 1.5]])); frame = { dist: 7, h: 1.6, look: .5 }; return 'วางตามเส้นจุด ใช้ instancing ประหยัด · low:true สำหรับขอบใกล้กล้อง'; },
  fountain: () => { const f = P.fountain(); holder.add(f); frame = { dist: 5, h: 2, look: 1 }; anim = t => f.userData.tick(t); return 'น้ำพุ่งขยับ · ใช้ใน Perth CBD และ Kings Park'; },
  'verandah-shop': () => { const a = P.verandahShop({ name: 'HARBOUR BOOKS', col: '#3e6a52', signBg: '#efe3c4', signFg: '#2c4a3a', wrap: 'w' }); a.position.x = -2.6; const b = P.verandahShop({ name: 'CASA GAVIOTA', col: '#efe0c0', spanish: true, iron: '#3a2a20', roof: '#c86a3a', signBg: '#b8603a' }); b.position.x = 2.4; holder.add(a, b); frame = { dist: 17, h: 4, look: 2 }; return 'แบบ Victorian และทรงสเปน ระเบียงอ้อมมุมได้ · userData.night(n) เปิดไฟหน้าต่าง'; },
  'perth-overworld': () => { window.open('scenes/perth-overworld/', '_blank'); return '<a href="scenes/perth-overworld/" target="_blank">เปิดเล่นโลก 3D (แท็บใหม่)</a> · Terrain: Terrain Tiles on AWS'; },
  'town-models': () => { window.open('scenes/town-models/', '_blank'); return '<a href="scenes/town-models/" target="_blank">เปิดดูโมเดลเมือง (แท็บใหม่)</a>'; },
  kit: () => { frame = { dist: 6, h: 1.4, look: .8 }; return 'ฟังก์ชันพื้นฐาน: สุ่มแบบกำหนด seed, noise, รวม geometry, ระบายสี, วัสดุ, สีแบบ sRGB → linear'; },
  ocean: () => 'ดูของจริงในเกมกอล์ฟ', heightfield: () => 'ดูของจริงในเกมกอล์ฟ', 'terrain-pack': () => 'เครื่องมือ Python ดึงความสูงจริงจาก lat/lon'
};
let showWx = false;
const WXS = [['เช้า', 8.3, 'hazy'], ['บ่าย', 15, 'clear'], ['เย็นทอง', 17.9, 'clear'], ['ครึ้ม', 15, 'overcast'], ['ฝน', 16, 'rain']];
function ctl(){
  const c = $('ctl'); c.innerHTML = '';
  if (!showWx) return;
  WXS.forEach(([n, h, w], i) => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { W.set({ hour: h, weather: w }); [...c.children].forEach(x => x.classList.remove('on')); b.classList.add('on'); }; c.appendChild(b); });
}
function select(it, el){
  document.querySelectorAll('.it').forEach(x => x.classList.remove('sel')); el && el.classList.add('sel');
  while (holder.children.length) holder.remove(holder.children[0]); anim = null; showWx = false;
  $('tName').textContent = it.th; let note = '';
  if (it.status === 'ready' && PREV[it.id]) note = PREV[it.id]() || '';
  $('tDesc').innerHTML = (it.status === 'ready' ? `<b style="color:var(--ok)">พร้อมใช้</b> · <code>${it.file}</code>` : `<b style="color:var(--plan)">รอย้ายเข้าคลัง</b> · ตอนนี้อยู่ใน <code>${it.from}</code>`) + (note ? `<br>${note}` : '') +
    (['ocean', 'heightfield', 'terrain-pack'].includes(it.id) ? `<br><a href="../golf/">เปิดเกมกอล์ฟ</a>` : '');
  let tris = 0; holder.traverse(o => { if (o.isMesh) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; } });
  $('stat').innerHTML = it.status === 'ready' ? `<span>สามเหลี่ยม <b>${Math.round(tris).toLocaleString()}</b></span><span>มาจาก <b>${it.from}</b></span>` : `<span>กลุ่ม <b>${GN[it.group] || it.group}</b></span>`;
  ctl();
}
/* list grouped by group, ready first */
const list = $('list'); let first = null, want = null;
Object.keys(cat.groups).forEach(g => {
  const its = cat.items.filter(i => i.group === g).sort((a, b) => (a.status === 'ready' ? 0 : 1) - (b.status === 'ready' ? 0 : 1)); if (!its.length) return;
  const h = document.createElement('div'); h.className = 'grp'; h.textContent = GN[g] || g; list.appendChild(h);
  its.forEach(it => { const d = document.createElement('div'); d.className = 'it' + (it.status === 'ready' ? ' ready' : ''); d.innerHTML = `<span class="dot"></span><span><b>${it.th}</b><small>${it.id}${it.status === 'ready' ? '' : ' · รอย้าย'}</small></span>`;
    d.onclick = () => select(it, d); list.appendChild(d); if (!first && it.id === 'kangaroo') first = [it, d]; if (location.hash.slice(1) === it.id) want = [it, d]; });
});
if (want || first) select(...(want || first));
/* loop: slow orbit */
let t = 0, last = performance.now(), drag = null, yaw = .5;
$('c').addEventListener('pointerdown', e => drag = { x: e.clientX, y: yaw }); addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (drag) yaw = drag.y - (e.clientX - drag.x) * .008; });
(function loop(now){ requestAnimationFrame(loop); const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt; if (!drag) yaw += dt * .12;
  cam.position.set(Math.sin(yaw) * frame.dist, frame.h, Math.cos(yaw) * frame.dist); cam.lookAt(0, frame.look, 0);
  if (anim) anim(t, dt); W.update(dt, cam, new THREE.Vector3()); renderer.render(scene, cam); })(last);
window.__lib = { select };
})();
</script>
</body>
</html>
