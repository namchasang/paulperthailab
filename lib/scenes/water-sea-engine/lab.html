  float brk=exp(-pow((d0-1.3)/.9,2.));/* waves break over the bar and fall apart into foam towards the sand */float broken=smoothstep(.3,.62,n2(vec2(vW.z*.35,d0*1.5)+vec2(0.,uT*.2)));
  float f3=exp(-pow((cr-.1)/.08,2.))*brk*broken*(.55+.45*lace)+exp(-pow((cr-.22)/.12,2.))*brk*lace2*broken*.5;
  /* a soft bubbly band behind the breakers */f3+=smoothstep(1.2,.3,d0)*smoothstep(.0,.3,d0)*lace*lace2*.35;
  float ring=smoothstep(.35,.0,viewD*abs(dot(V,vec3(0,1,0)))-.02)*(1.-smoothstep(1.2,2.5,depth+0.))*lace;
  float objF=0.;if(bedP.y>uLevel-.6&&depth<.6&&viewD<1.2)objF=0.;
  float hullF=(1.-smoothstep(.0,.14,lvl-bedP.y))*step(.5,d0)*(.5+.5*lace2);f3+=hullF;

const water=new THREE.Mesh(new THREE.PlaneGeometry(S,S,160,160).rotateX(-Math.PI/2),wm);scene.add(water);
// ---------- controls ----------

$('lvl').oninput=e=>{U.uLevel.value=+e.target.value;$('lvlT').textContent=(+e.target.value).toFixed(2);};
const mode=n=>{wm.uniforms.uNew.value=n;U.uOn.value=n;$('mNew').classList.toggle('on',!!n);$('mOld').classList.toggle('on',!n);};$('mNew').onclick=()=>mode(1);$('mOld').onclick=()=>mode(0);
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{hour=+b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));});
const q=n=>{wm.uniforms.uQ.value=n;R.setPixelRatio(n?Math.min(devicePixelRatio,2):1);resize();$('qHi').classList.toggle('on',!!n);$('qLo').classList.toggle('on',!n);};$('qHi').onclick=()=>q(1);$('qLo').onclick=()=>q(0);
$('tide').onclick=()=>{tide=!tide;$('tide').classList.toggle('on',tide);};
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();const v=R.getDrawingBufferSize(new THREE.Vector2());rt.setSize(v.x,v.y);wm.uniforms.uRes.value.copy(v);}addEventListener('resize',resize);resize();
// ---------- loop ----------
let last=performance.now(),fr=0,ft=0;const T0=performance.now();
function light(){const a=(hour-6)/12*Math.PI,el=Math.max(.12,Math.sin(a));sun.position.set(Math.cos(a)*-80,el*90+8,40);const warm=hour>16.5||hour<8.5;sun.color.set(warm?0xffc890:0xfff2dc);sun.intensity=warm?.85:1.0;
  sky.color.set(warm?0xf0c8a8:0xbfe4ff);scene.background=new THREE.Color(warm?'#f2c7a0':'#bfe4ff');wm.uniforms.uSun.value.copy(sun.position).normalize();wm.uniforms.uSunC.value.copy(sun.color);wm.uniforms.uSky.value.copy(scene.background).convertSRGBToLinear();}
function loop(now){requestAnimationFrame(loop);const dt=(now-last)/1000;last=now;fr++;ft+=dt;if(ft>.5){$('fps').textContent=Math.round(fr/ft)+' fps';fr=0;ft=0;}
  U.uT.value=(now-T0)/1000;if(tide){U.uLevel.value=Math.sin(U.uT.value*.12)*1.1+.4;$('lvl').value=U.uLevel.value;$('lvlT').textContent=U.uLevel.value.toFixed(2);}
  window.__boat.position.y=U.uLevel.value+.35+Math.sin(U.uT.value*1.3)*.06;window.__boats.forEach((b,k)=>{b.position.y=U.uLevel.value-(b.userData.sink||0)+.05+Math.sin(U.uT.value*1.1+k)*.05;b.rotation.z=Math.sin(U.uT.value*.8+k)*.03;});window.__boat.rotation.z=Math.sin(U.uT.value*.9)*.04;
