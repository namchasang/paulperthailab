<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Quokka Overworld</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one full-screen game view; HUD panels float in the corners like an old RPG overworld */
:root{--night:#141a2e;--panel:rgba(20,26,46,.82);--ink:#f5ecd8;--dim:#a9b3cf;--gold:#ffd34d;--edge:#3a4670;
  --disp:"Pixelify Sans","Courier New",monospace;--body:"M PLUS Rounded 1c",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hud{position:fixed;background:var(--panel);border:2px solid var(--edge);border-radius:6px;padding:8px 10px}
#place{top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));max-width:min(70vw,360px)}
#place b{font-family:var(--disp);font-size:18px;color:var(--gold);display:block}
#place span{font-size:12px;color:var(--dim)}
#msg{left:50%;top:calc(18% + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--disp);font-size:17px;text-align:center;min-width:220px;display:none}
#mini{right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:4px;opacity:.92}
#mini canvas{display:block;width:min(34vw,180px);image-rendering:pixelated}
#btns{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(min(34vw,180px)*.67 + 30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#btns button,#top button{font-family:var(--disp);font-size:15px;background:var(--panel);color:var(--ink);border:2px solid var(--edge);border-radius:8px;padding:9px 14px;cursor:pointer}
#btns button.main{background:var(--gold);color:#141a2e;border-color:var(--gold)}
#btns button:focus-visible,#top button:focus-visible{outline:2px solid var(--ink)}
#top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px}
#help{left:max(10px,env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:11px;color:var(--dim);max-width:46vw}
[hidden]{display:none!important}
#layp{top:calc(56px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:grid;gap:4px;max-height:60vh;overflow:auto;width:220px}#layp label{display:grid;grid-template-columns:16px 12px 1fr auto;gap:6px;align-items:center;font-size:12px;cursor:pointer}#layp i{width:10px;height:10px;border-radius:2px}#layp small{color:var(--dim)}#layp input{margin:0;accent-color:var(--gold)}
#drive{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:calc(min(34vw,180px) + 30px);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}#drive>div{display:flex;gap:10px;pointer-events:auto}
#drive button{width:74px;height:74px;border-radius:50%;font-family:var(--disp);font-size:15px;background:var(--panel);color:var(--ink);border:2px solid var(--edge);touch-action:none;-webkit-user-select:none;user-select:none}#drive button.on{background:var(--gold);color:#141a2e}#drive .gas{background:#2e7a3e;border-color:#3ec46a}#drive .brk{background:#7a2a2a;border-color:#d8323a}
#stick{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(245,236,216,.35);display:none;pointer-events:none}
#stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(245,236,216,.45)}
</style>
<canvas id="c"></canvas>
<div class="hud" id="place"><b id="pName">Swan River</b><span id="pNote">Walk or drive · towns glow gold</span></div>
<div class="hud" id="msg"></div>
<div id="top"><button type="button" id="bLay">Layers</button><button type="button" id="bTime">Dusk</button></div>
<div class="hud" id="layp" hidden><b style="font-family:var(--disp);color:var(--gold)">Ten layers</b><div id="laylist"></div><button type="button" id="bTint">Tint layers</button></div>
<div id="btns"><button type="button" id="bAct" class="main">Enter</button><div style="display:flex;gap:6px"><button type="button" id="bRotL" aria-label="Turn camera left">⟲</button><button type="button" id="bCar">Get in car</button><button type="button" id="bRotR" aria-label="Turn camera right">⟳</button></div></div>
<div class="hud" id="mini"><canvas id="mm" width="150" height="100"></canvas></div>
<div class="hud" id="help">Walk: drag or WASD · Car: GAS / BRAKE / ◀ ▶ (or arrow keys) · Pinch or scroll to zoom · ⟲ ⟳ turn the camera 45° when walking</div>
<div id="stick"><i></i></div>
<div id="drive" hidden><div><button type="button" data-k="l" aria-label="Steer left">◀</button><button type="button" data-k="r" aria-label="Steer right">▶</button></div><div><button type="button" class="brk" data-k="b">BRAKE</button><button type="button" class="gas" data-k="g">GAS</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
