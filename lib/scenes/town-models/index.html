<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Quokka Town Models</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: a model-maker's bench. The diorama fills the screen; a panel on the right picks the town and the ten layers. */
:root{--night:#141a2e;--panel:rgba(20,26,46,.88);--ink:#f5ecd8;--dim:#a9b3cf;--gold:#ffd34d;--edge:#3a4670;
  --disp:"Pixelify Sans","Courier New",monospace;--body:"M PLUS Rounded 1c",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#panel{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 20px));max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--panel);border:2px solid var(--edge);border-radius:8px;padding:12px;box-sizing:border-box;display:grid;gap:10px}
h1{font-family:var(--disp);font-size:20px;margin:0;color:var(--gold)}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0}
.row{display:flex;flex-wrap:wrap;gap:5px}
button{font-family:var(--disp);font-size:14px;background:#1d2540;color:var(--dim);border:2px solid #2c3658;border-radius:6px;padding:5px 9px;cursor:pointer}
button[aria-pressed="true"]{background:var(--gold);color:#141a2e;border-color:var(--gold)}
button:focus-visible,label:focus-within{outline:2px solid var(--ink)}
.layers{display:grid;gap:3px}
.layers label{display:grid;grid-template-columns:18px 14px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:3px 6px;border-radius:5px;background:#1a2138;cursor:pointer}
.layers input{accent-color:var(--gold);margin:0}.layers i{width:12px;height:12px;border-radius:3px;display:block}.layers small{color:var(--dim);font-variant-numeric:tabular-nums}
#note{font-size:12px;color:var(--dim);margin:0}
#name{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font-family:var(--disp);font-size:clamp(18px,4vw,30px);text-shadow:0 2px 0 #000a}
#name small{display:block;font-family:var(--body);font-size:12px;color:var(--dim)}
#hide{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px))}
@media (max-width:640px){#panel{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:46%}#name{bottom:auto;top:calc(52px + env(safe-area-inset-top,0px))}}
</style>
<canvas id="c"></canvas>
<button id="hide" type="button">Hide panel</button>
<div id="name"></div>
<div id="panel">
  <h1>Town Models</h1>
  <div><h2>Town</h2><div class="row" id="towns"></div></div>
  <div><h2>Ten layers</h2><div class="layers" id="layers"></div></div>
  <div class="row"><button type="button" id="allOn">All on</button><button type="button" id="solo" aria-pressed="false">Tint layers</button><button type="button" id="spin" aria-pressed="true">Turntable</button><button type="button" id="tilt" aria-pressed="true">Tilt-shift</button></div>
  <div><h2>Time</h2><div class="row" id="times"></div></div>
  <p id="note">Drag to turn the model, pinch or scroll to zoom. Plants, people and animals are pixel sprites; buildings and vehicles are low-poly 3D, the same rule as the game.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{

  const e=tex(cols*8,rows*8,(x)=>{x.fillStyle='#000';x.fillRect(0,0,cols*8,rows*8);for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){if(((i*7+j*3)%5)<3){x.fillStyle='#ffd8a0';x.fillRect(i*8+2,j*8+2,4,5);}}});

const tree=(x,z,kind,sc)=>{const [P2,trunk]=TREEC[kind||'green'];sc=sc||1;const rr=rng(Math.abs((x*73+z*31+1000)|0)%2147483646+1);

const SK=['#f1c7a0','#e2b48a','#c68a5e','#8d5a3b'],SH=['#c8344a','#2f6fb0','#3ec46a','#e8a33a','#9478d4','#f6f2e8','#1d3a6e','#ef7d9a'];
const person=(x,z)=>{const sk=pick(SK),sh=pick(SH),pa=pick(['#2a2a48','#5a4a3a','#3a3a48','#c9b68a']),hr=pick(['#2a1d16','#6b4226','#d8a050','#1e1a18']);

const quokka=(x,z)=>sprite('life',(g)=>{g.fillStyle='#8a6040';g.fillRect(2,3,7,5);g.fillRect(3,1,2,2);g.fillRect(7,1,2,2);g.fillStyle='#b8865a';g.fillRect(3,5,5,3);g.fillStyle='#141010';g.fillRect(4,4,1,1);g.fillRect(7,4,1,1);g.fillStyle='#6a4a30';g.fillRect(2,8,7,3);},11,11,.45,.45,x,0,z);
const roo=(x,z)=>sprite('life',(g)=>{g.fillStyle='#a08a70';g.fillRect(6,1,3,3);g.fillRect(5,4,4,7);g.fillRect(3,10,3,2);g.fillRect(8,10,4,2);g.fillStyle='#806a54';g.fillRect(0,8,5,1);g.fillStyle='#141010';g.fillRect(7,2,1,1);},12,12,.75,.75,x,0,z);
const swan=(x,z)=>sprite('life',(g)=>{g.fillStyle='#141418';g.fillRect(1,5,8,3);g.fillRect(7,1,1,5);g.fillStyle='#d8323a';g.fillRect(8,1,2,1);},10,8,.5,.4,x,.05,z);
// lamps with night halos
const HALO=[];const haloT=tex(32,32,(x)=>{const g=x.createRadialGradient(16,16,0,16,16,16);g.addColorStop(0,'rgba(255,225,160,1)');g.addColorStop(.4,'rgba(255,190,110,.45)');g.addColorStop(1,'rgba(255,170,90,0)');x.fillStyle=g;x.fillRect(0,0,32,32);});
const bulbM=new THREE.MeshStandardMaterial({color:lin('#f6efd8'),emissive:new THREE.Color(0)});NIGHT.push(bulbM);
const lamp=(x,z,h)=>{h=h||1.6;cyl('props',.04,.05,h,'#2e3236',x,h/2,z,6);const b=new THREE.Mesh(new THREE.SphereGeometry(.09,8,6),bulbM);b.position.set(x,h+.05,z);tag(b,'lights');

const retro=(x,z,ry)=>{const g=new THREE.Group();const B=(w,h,d,col,x2,y,z2)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(col));m.position.set(x2,y,z2);g.add(m);};B(.8,.22,.45,'#efe6cc',0,.2,0);B(.46,.17,.4,'#9cb6c6',-.08,.38,0);B(.52,.05,.44,'#1c1c1e',-.08,.48,0);[-.25,.25].forEach(a=>[-.23,.23].forEach(b=>{const w=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.05,10),M('#1c1c1e'));w.rotation.x=Math.PI/2;w.position.set(a,.1,b);g.add(w);}));g.position.set(x,0,z);g.rotation.y=ry||0;tag(g,'veh');};

// ground: a model base with a wooden rim, land shape painted on a canvas, sea around it
const base=(draw,opts)=>{opts=opts||{};const S=40;
  const rim=new THREE.Mesh(new THREE.BoxGeometry(S+1.4,1.4,S+1.4),M('#5a3a22',{roughness:.6}));rim.position.y=-.75;tag(rim,'ground');

  const sea=new THREE.Mesh(new THREE.BoxGeometry(S,.3,S),new THREE.MeshStandardMaterial({color:lin('#2a7a98'),roughness:.15,metalness:.1,transparent:true,opacity:.92}));sea.position.y=-.2;tag(sea,'water');

  if(!o.noLine)for(let s=.6;s<L;s+=1.2){flat('roads',.5,.06,'#f3f3ea',x1+(x2-x1)*s/L,z1+(z2-z1)*s/L,(o.y||.035)+.005,-a);}
  if(o.foot)[-1,1].forEach(sd=>{const ox=-Math.sin(a)*(w/2+.35)*sd,oz=Math.cos(a)*(w/2+.35)*sd;flat('roads',L,.6,'#cfcac0',(x1+x2)/2+ox,(z1+z2)/2+oz,.03,-a);});return m;};

const ORDER=['island','freo','cbd','sp','hi','vp','air'];
// ---------- UI ----------
let cur='freo',time='day',tint=false;const on=LAYERS.map(()=>true);
ORDER.forEach(id=>{const b=document.createElement('button');b.type='button';b.textContent=TOWNS[id].name.split(' ·')[0];b.onclick=()=>{cur=id;build();};b.dataset.t=id;$('towns').appendChild(b);});
LAYERS.forEach(([id,n,c],i)=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" checked id="ly${i}"><i style="background:${c}"></i><span>${i+1}. ${n}</span><small id="lc${i}">0</small>`;$('layers').appendChild(l);l.querySelector('input').onchange=e=>{on[i]=e.target.checked;applyLayers();};});
[['day','Day'],['gold','Golden hour'],['night','Night']].forEach(([k,n])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.dataset.k=k;b.onclick=()=>{time=k;light();};$('times').appendChild(b);});
$('allOn').onclick=()=>{on.fill(true);LAYERS.forEach((_,i)=>$('ly'+i).checked=true);applyLayers();};
$('solo').onclick=()=>{tint=!tint;$('solo').setAttribute('aria-pressed',tint);applyTint();};
let spin=true;$('spin').onclick=()=>{spin=!spin;$('spin').setAttribute('aria-pressed',spin);};
let tilt=true;$('tilt').onclick=()=>{tilt=!tilt;$('tilt').setAttribute('aria-pressed',tilt);};
$('hide').onclick=()=>{const p=$('panel');p.hidden=!p.hidden;$('hide').textContent=p.hidden?'Show panel':'Hide panel';};
function applyLayers(){cam.layers.set(0);on.forEach((v,i)=>{if(v)cam.layers.enable(i+1);});sun.layers.enableAll();}
const TINT={};function applyTint(){if(!BAG)return;Object.keys(BAG).forEach(L=>BAG[L].forEach(o=>o.traverse(m=>{if(!m.isMesh&&!m.isSprite)return;if(tint){if(!m.userData.om){m.userData.om=m.material;const c=LAYERS[LI[L]-1][2];m.material=m.isSprite?new THREE.SpriteMaterial({color:lin(c),map:m.material.map,alphaTest:.5}):new THREE.MeshLambertMaterial({color:lin(c)});}}else if(m.userData.om){m.material=m.userData.om;m.userData.om=null;}})));}
function light(){[...$('times').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===time));const n=time==='night',g=time==='gold';
  scene.background=new THREE.Color(n?'#10142a':g?'#e8b890':'#bcdcf0').convertSRGBToLinear();scene.fog=new THREE.Fog(scene.background,90,200);
  sun.color.set(n?0x8a9ad8:g?0xffb070:0xffe8c8);sun.intensity=n?.35:g?1.35:1.6;hemi.intensity=n?.28:g?.5:.6;hemi.color.set(n?0x6a78c0:g?0xffd8b0:0xd8e8ff);
  const a=g?.35:.95;sun.position.set(-30*Math.cos(a),40*Math.sin(a)+6,22);
  NIGHT.forEach(m=>m.emissive.setRGB(n?1.3:0,n?1.05:0,n?.7:0));HALO.forEach(h=>{if(h.isPointLight)h.intensity=n?1.4:0;else h.material.opacity=n?.85:0;});R.toneMappingExposure=n?1.25:1.08;}
function build(){if(ROOT){scene.remove(ROOT);ROOT.traverse(o=>{if(o.geometry)o.geometry.dispose();});}NIGHT.length=0;NIGHT.push(bulbM);HALO.length=0;SPR.length=0;r=rng(ORDER.indexOf(cur)*101+7);
  ROOT=new THREE.Group();scene.add(ROOT);BAG={};LAYERS.forEach(l=>BAG[l[0]]=[]);TOWNS[cur].build();
  LAYERS.forEach((l,i)=>{let n=0;BAG[l[0]].forEach(o=>o.traverse(m=>{if(m.isMesh||m.isSprite||m.isLight)n++;}));$('lc'+i).textContent=n;});
  [...$('towns').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===cur));$('name').innerHTML=TOWNS[cur].name+'<small>'+TOWNS[cur].note+'</small>';
  applyLayers();light();if(tint)applyTint();try{history.replaceState(null,'','#'+cur);}catch(e){}}
const h=(location.hash||'').slice(1);if(TOWNS[h])cur=h;build();addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(TOWNS[k]&&k!==cur){cur=k;build();}});
// ---------- orbit ----------
let yaw=.7,pitch=.68,dist=50,drag=null,pinch=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.008;pitch=Math.max(.2,Math.min(1.35,pitch+(e.clientY-drag.y)*.006));drag.x=e.clientX;drag.y=e.clientY;});
cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('wheel',e=>{dist=Math.max(22,Math.min(110,dist*(1+Math.sign(e.deltaY)*.08)));e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)dist=Math.max(22,Math.min(110,dist*pinch/d));pinch=d;drag=null;}},{passive:true});cv.addEventListener('touchend',()=>pinch=null);
// tilt-shift: render, then blur the top and bottom bands with a second pass
const rt=new THREE.WebGLRenderTarget(4,4,{encoding:THREE.sRGBEncoding});const post=new THREE.ShaderMaterial({uniforms:{t:{value:null},px:{value:new THREE.Vector2()},on:{value:1}},vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:'uniform sampler2D t;uniform vec2 px;uniform float on;varying vec2 v;void main(){float b=on*smoothstep(.18,.5,abs(v.y-.46))*3.5;vec4 c=vec4(0.);float w=0.;for(int i=-3;i<=3;i++)for(int j=-3;j<=3;j++){float k=exp(-float(i*i+j*j)/8.);c+=texture2D(t,v+vec2(float(i),float(j))*px*b)*k;w+=k;}c/=w;c.rgb=mix(c.rgb,c.rgb*vec3(1.04,1.,.96),.5);gl_FragColor=c;}'});
const pq=new THREE.Mesh(new THREE.PlaneGeometry(2,2),post),ps=new THREE.Scene(),pc=new THREE.OrthographicCamera(-1,1,1,-1,0,1);ps.add(pq);
function resize(){const w=innerWidth,h2=innerHeight,pr=Math.min(devicePixelRatio,2);R.setPixelRatio(pr);R.setSize(w,h2,false);rt.setSize(w*pr,h2*pr);post.uniforms.px.value.set(1/(w*pr),1/(h2*pr));cam.aspect=w/h2;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(spin&&!drag)yaw+=dt*.12;
  cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,1,0);
  const ti=now/1000;HALO.forEach((s,i)=>{if(!s.isPointLight&&time==='night')s.material.opacity=.7+Math.sin(ti*3+i)*.12;});
  if(tilt){post.uniforms.on.value=1;R.setRenderTarget(rt);R.render(scene,cam);R.setRenderTarget(null);post.uniforms.t.value=rt.texture;R.render(ps,pc);}else R.render(scene,cam);
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
