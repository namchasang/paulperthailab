<script>/* Terrain Engine (Paul Perth Library, Nov 2026) — natural ground for three.js r128.

    s.vertexShader='varying vec3 vTW;varying vec3 vTN;\n'+s.vertexShader.replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvTW=(modelMatrix*vec4(transformed,1.)).xyz;vTN=normalize(mat3(modelMatrix)*objectNormal);');

<script>/* Sky & Weather Engine (Paul Perth Library, Nov 2026) — sky, sun, light and weather for three.js r128.

   dawn and dusk bands, stars and a moon at night, a few high fair-weather clouds that drift with the wind. The sun light follows the
   time of day (warm and low at the ends, white at noon), the hemisphere light takes the sky and ground bounce colours, fog matches
   the horizon. Weathers only change wind, cloud and haze (Paul: no rain or grey days). */

<script>/* Props Engine (Paul Perth Library, Nov 2026) — small 3D street and park furniture for three.js r128.
   const P=PropsEngine.create({scene,heightAt});
   P.add(kind,x,z,{rot,scale,text,color,lines})  -> Group      kinds: lamp, bench, bin, sign, busstop, fence (lines:[[x,z],...]),

   P.update(t) lights the lamps at night (P.night=0..1) and bobs buoys.
   Everything is real geometry with soft toon colours (no pictures except sign lettering, drawn crisp at 4x).
   Each prop gets userData.prop={kind} and a footprint userData.foot=[x1,z1,x2,z2] for colliders. */
