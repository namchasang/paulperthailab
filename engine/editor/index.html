<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paul Engine Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a level-editor workbench. Asset shelf left, the live scene in the middle, inspector right; on phones the side panels become drawers. Single dark workshop look on purpose. */
:root{
  --ink:#15141b; --bench:#1e1c26; --shelf:#26232f; --rule:#3a3647; --text:#efeae0; --dim:#a39db3;
  --lime:#9be02f; --blue:#2f6bdc; --amber:#ffc23a; --red:#ff5a46; --cyan:#58e1ff;
  --ui:"Mitr",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font:14px/1.4 var(--ui);overflow:hidden}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:260px 1fr 280px;grid-template-areas:"top top top" "left view right"}
header{grid-area:top;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:var(--bench);border-bottom:2px solid var(--rule)}
.brand{font-weight:500;letter-spacing:.02em;margin-right:6px;white-space:nowrap}.brand b{color:var(--lime);font-weight:500}
#sName{font:inherit;color:inherit;background:var(--ink);border:2px solid var(--rule);padding:4px 8px;width:200px;min-width:0}
button,select,input{font:inherit;color:inherit}
.b{background:var(--shelf);border:2px solid var(--rule);padding:4px 10px;cursor:pointer;white-space:nowrap}
.b:hover{border-color:#57506b}.b.on{border-color:var(--lime);color:var(--lime)}.b.main{background:var(--blue);border-color:#4c86f0}.b.play{background:#2f7a3a;border-color:var(--lime)}
.b:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.sp{flex:1}
aside{background:var(--bench);overflow:auto;min-width:0}
#left{grid-area:left;border-right:2px solid var(--rule);display:flex;flex-direction:column}
#right{grid-area:right;border-left:2px solid var(--rule);padding:10px 12px;display:grid;gap:14px;align-content:start}
#view{grid-area:view;position:relative;overflow:hidden;background:#000}
#stage{position:absolute;inset:0}
.tools{display:flex;gap:4px;padding:8px;border-bottom:2px solid var(--rule);flex-wrap:wrap}
.cats{display:flex;gap:4px;padding:8px;flex-wrap:wrap;border-bottom:2px solid var(--rule)}
.cats button{background:none;border:1px solid var(--rule);padding:2px 8px;cursor:pointer;font-size:13px}.cats button.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;padding:8px;align-content:start}
.asset{background:var(--shelf);border:2px solid var(--rule);padding:4px 2px 5px;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:11.5px;line-height:1.2;text-align:center;min-width:0}
.asset img{width:60px;height:60px;image-rendering:auto}.asset .ph{width:60px;height:60px;background:repeating-linear-gradient(45deg,#2c2937 0 6px,#26232f 6px 12px)}
.asset.on{border-color:var(--lime);background:#2c3a1f}.asset span{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
h3{margin:0 0 6px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.f{display:grid;grid-template-columns:90px 1fr;gap:6px 8px;align-items:center;font-size:13px}
.f input[type=text],.f input[type=number],.f select{background:var(--ink);border:2px solid var(--rule);padding:3px 6px;min-width:0;width:100%}
.f input[type=range]{width:100%;accent-color:var(--lime)}
.sw{display:flex;gap:4px;flex-wrap:wrap}.sw button{width:22px;height:22px;border:2px solid var(--rule);cursor:pointer;padding:0}.sw button.on{border-color:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;font-size:13px}.layers label{display:flex;gap:6px;align-items:center;cursor:pointer}
.mono{font-family:var(--mono);font-size:12px;color:var(--dim)}
.paths{display:grid;gap:6px}.pathrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center;background:var(--shelf);border:1px solid var(--rule);padding:4px 6px;font-size:12.5px}
.pathrow select,.pathrow input{background:var(--ink);border:1px solid var(--rule);padding:1px 4px;width:100%}
.hint{position:absolute;left:12px;bottom:12px;max-width:min(520px,calc(100% - 24px));background:#15141bd9;border:1px solid var(--rule);padding:6px 10px;font-size:12.5px;color:var(--dim);pointer-events:none}
.hint b{color:var(--text);font-weight:500}
.vbtns{position:absolute;right:12px;top:12px;display:grid;gap:6px}
.vbtns .b{width:40px;height:36px;padding:0;background:#1e1c26e6}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--bench);border:2px solid var(--rule);width:min(640px,100%);max-height:90vh;overflow:auto;padding:16px;display:grid;gap:10px}
.modal textarea{width:100%;min-height:240px;background:var(--ink);color:var(--text);border:2px solid var(--rule);font:12px/1.4 var(--mono);padding:8px}
.modal h2{margin:0;font-size:18px;font-weight:500}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.cards button{text-align:left;background:var(--shelf);border:2px solid var(--rule);padding:10px;cursor:pointer;display:grid;gap:3px}.cards button small{color:var(--dim)}
#play{position:fixed;inset:0;z-index:30}#playX{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:31}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--bench);border:2px solid var(--lime);padding:6px 12px;z-index:5}
.mtog{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-areas:"top" "view"}
  aside{position:fixed;top:auto;bottom:0;left:0;right:0;max-height:55vh;z-index:10;border:0;border-top:2px solid var(--lime);padding-bottom:env(safe-area-inset-bottom,0px)}
  aside:not(.open){display:none!important}
  .mtog{display:inline-block}
  #sName{width:130px}
}
</style>

</head><body>
<div id="app">
  <header>
    <span class="brand">Paul Engine <b>Editor</b></span>
    <input id="sName" aria-label="ชื่อฉาก" value="ฉากใหม่">
    <button class="b mtog" id="mLeft">ของ</button><button class="b mtog" id="mRight">ตั้งค่า</button>
    <button class="b" id="bNew">ใหม่ / ตัวอย่าง</button>
    <button class="b" id="bSave">บันทึก</button>
    <button class="b" id="bOpen">เปิด</button>
    <button class="b" id="bJson">JSON</button>
    <button class="b" id="bUndo" title="ย้อนกลับ (Ctrl+Z)">↶</button>
    <span class="sp"></span>
    <button class="b main" id="bExport">ส่งออกเกม</button>
    <button class="b play" id="bPlay">▶ เล่นทดสอบ</button>
  </header>
  <aside id="left">
    <div class="tools" role="toolbar" aria-label="เครื่องมือ">
      <button class="b on" data-tool="select" title="เลือก / ย้าย (V)">เลือก·ย้าย</button>
      <button class="b" data-tool="place" title="วางของที่เลือก (B)">วาง</button>
      <button class="b" data-tool="path" title="วาดทางเดิน/ถนน (P)">ทางเดิน</button>
    </div>
    <div class="cats" id="cats"></div>
    <div id="shelf"></div>
  </aside>
  <div id="view">
    <div id="stage"></div>
    <div class="vbtns">
      <button class="b" id="vRotL" title="หมุนซ้าย (Q)">⟲</button><button class="b" id="vRotR" title="หมุนขวา (E)">⟳</button>
      <button class="b" id="vZin" title="ซูมเข้า">＋</button><button class="b" id="vZout" title="ซูมออก">－</button>
      <button class="b" id="vMode" title="สลับภาพปกติ / พิกเซล">PX</button>
    </div>
    <div class="hint" id="hint"></div>
    <div id="toast" hidden></div>
  </div>
  <aside id="right">
    <section id="insp"></section>
    <section><h3>ฉาก</h3>
      <div class="f">
        <span>กว้าง × ลึก</span><div class="row" style="flex-wrap:nowrap"><input type="number" id="gW" min="12" max="160" step="4"><input type="number" id="gD" min="12" max="160" step="4"></div>
        <span>สีพื้น</span><input type="color" id="gC" style="width:100%;height:28px;border:2px solid var(--rule);background:var(--ink)">
        <span>เวลา <span class="mono" id="tL"></span></span><input type="range" id="tS" min="0" max="23.9" step=".1">
        <span>ภาพ</span><select id="sMode"><option value="smooth">3D ปกติ</option><option value="pixel">True pixel art</option></select>
        <span>จำนวนสี</span><input type="range" id="sPal" min="8" max="64" step="4">
        <span>ขอบ / Dither</span><div class="row"><label><input type="checkbox" id="sOut"> ขอบ 1px</label><label><input type="checkbox" id="sDit"> dither</label></div>
        <span>เทมเพลต</span><select id="sTpl"><option value="shop">บริหารร้าน</option><option value="viewer">เดินชมฉาก</option></select>
      </div>
    </section>
    <section><h3>ชั้น (เปิด/ปิด)</h3><div class="layers" id="layers"></div></section>
    <section><h3>ทางเดินและถนน</h3><div class="paths" id="paths"></div><p class="mono" id="pathHelp" style="margin:6px 0 0">ใช้เครื่องมือ "ทางเดิน" แตะจุดบนพื้นทีละจุด แล้วกด Enter หรือปุ่มจบเส้น</p></section>
    <section><h3>เกมบริหารร้าน</h3><p class="mono" style="margin:0" id="gameInfo"></p></section>
  </aside>
</div>
<div class="modal" id="modal" hidden><div class="box" id="mbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script data-pe="lib/core/kit.js">
/* ==== PPL core kit: shared helpers for every Paul Perth library item ====
   Needs THREE r128 loaded first. Everything lives on window.PPL. */
(function(){
const P = window.PPL = window.PPL || {};
P.ver = '0.1';
P.items = P.items || {};
P.reg = (id, meta) => { P.items[id] = meta; };

/* seeded random: same seed -> same tree, rock, mob of roos */
P.rng = seed => { let a = seed >>> 0 || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
P.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
P.lerp = (a, b, t) => a + (b - a) * t;
P.smooth = (a, b, x) => { const t = P.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
P.V3 = (x, y, z) => new THREE.Vector3(x, y, z);
/* colours are written as sRGB hex (what you see in a colour picker); the renderer works in linear light */
P.lin = c => new THREE.Color(c).convertSRGBToLinear();

/* value noise 2D (cheap, tileable enough for ground breakup) */
P.noise2 = (() => {
  const p = new Uint8Array(512), R = P.rng(1337);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (R() * (i + 1)) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 256; i++) p[i + 256] = p[i];
  const g = (h, x, y) => { h &= 7; const u = h < 4 ? x : y, v = h < 4 ? y : x; return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v); };
  const f = t => t * t * t * (t * (t * 6 - 15) + 10);
  return (x, y) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y);
    const u = f(x), v = f(y), a = p[X] + Y, b = p[X + 1] + Y;
    return P.lerp(P.lerp(g(p[a], x, y), g(p[b], x - 1, y), u), P.lerp(g(p[a + 1], x, y - 1), g(p[b + 1], x - 1, y - 1), u), v) * 0.25;
  };
})();
P.fbm = (x, y, oct = 4) => { let s = 0, a = .5, f = 1; for (let i = 0; i < oct; i++) { s += a * P.noise2(x * f, y * f); f *= 2; a *= .5; } return s; };

/* geometry helpers: transform, vertex-paint, merge (vertex colours keep draw calls low) */
P.tr = (g, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) => {
  if (sx !== 1 || sy !== 1 || sz !== 1) g.scale(sx, sy, sz);
  if (rx) g.rotateX(rx); if (ry) g.rotateY(ry); if (rz) g.rotateZ(rz);
  g.translate(x, y, z); return g;
};
P.paint = (g, cols, jitter = 0, seed = 1) => {
  g = g.index ? g.toNonIndexed() : g;
  const n = g.attributes.position.count, c = new Float32Array(n * 3), R = P.rng(seed), cs = cols.map(x => P.lin(x));
  for (let f = 0; f < n; f += 3) {
    const col = cs[(R() * cs.length) | 0].clone(); if (jitter) col.offsetHSL(0, 0, (R() - .5) * jitter);
    for (let k = 0; k < 3 && f + k < n; k++) { c[(f + k) * 3] = col.r; c[(f + k) * 3 + 1] = col.g; c[(f + k) * 3 + 2] = col.b; }
  }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3)); return g;
};
P.merge = list => {
  const gs = list.map(g => { g = g.index ? g.toNonIndexed() : g; if (!g.attributes.normal) g.computeVertexNormals(); return g; });
  let n = 0; gs.forEach(g => n += g.attributes.position.count);
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3); let o = 0;
  gs.forEach(g => {
    const c = g.attributes.position.count; pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3);
    if (g.attributes.color) col.set(g.attributes.color.array, o * 3); else col.fill(1, o * 3, (o + c) * 3); o += c;
  });
  const m = new THREE.BufferGeometry();
  m.setAttribute('position', new THREE.BufferAttribute(pos, 3)); m.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); m.setAttribute('color', new THREE.BufferAttribute(col, 3));
  m.computeBoundingSphere(); return m;
};

/* light from above inside a blob of foliage: darker underside, brighter sunlit top (cheap fake AO) */
P.shadeY = (g, lo = .65, hi = 1.15) => {
  if (!g.attributes.normal) g.computeVertexNormals();
  const n = g.attributes.normal, c = g.attributes.color; if (!c) return g;
  for (let i = 0; i < n.count; i++) { const k = P.lerp(lo, hi, (n.getY(i) + 1) / 2); c.setXYZ(i, c.getX(i) * k, c.getY(i) * k, c.getZ(i) * k); }
  return g;
};
/* materials (cached) */
const MC = {};
P.mat = (color, o) => { const k = color + JSON.stringify(o || {}); if (MC[k]) return MC[k]; const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: .85 }, o || {})); m.color = P.lin(color); return MC[k] = m; };
P.vmat = o => P.mat('#ffffff', Object.assign({ vertexColors: true }, o || {}));

/* canvas texture helper */
P.ctex = (w, h, draw, repeat) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  t.anisotropy = 4; return t;
};
/* soft grey noise used as a detail map on terrain, bark, rock */
P.detailTex = (() => { let t; return () => t || (t = P.ctex(256, 256, (x, w, h) => {
  const d = x.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const v = 178 + 90 * (0.45 * P.fbm(i / 20, j / 20, 4) + 0.55 * P.noise2(i / 2.2, j / 2.2));
    const k = (j * w + i) * 4; d.data[k] = d.data[k + 1] = d.data[k + 2] = P.clamp(v, 95, 255); d.data[k + 3] = 255;
  }
  x.putImageData(d, 0, 0);
}, 1)); })();

P.shadowAll = (o, cast = true, recv = false) => { o.traverse(m => { if (m.isMesh) { m.castShadow = cast; m.receiveShadow = recv; } }); return o; };
})();

</script>
<script data-pe="lib/models/fauna/kangaroo.js">
/* ==== PPL kangaroo (from Roo Road Rescue makeRoo3, smooth-shaded) ====
   const r = PPL.kangaroo({fur:'#8c7766', pose:'graze', seed:3});  scene.add(r);
   r.userData.setPose('stand'|'graze'|'lie'|'alert');
   r.userData.hop(target THREE.Vector3, groundFn(x,z)->y)   // hops there in bounds
   PPL.kangarooTick(r, dt, groundFn)                         // call every frame
   Size: ~1.5 m standing at scale 1 (real western grey ~1.3-1.6 m). */
(function(){
const P = window.PPL;
const SPH = (r, w, h) => new THREE.SphereGeometry(r, w || 12, h || 9);
const sm = (c, o) => { const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: .82 }, o || {})); m.color = (c.isColor ? c.clone() : P.lin(c)); return m; };
function kit(){
  const g = new THREE.Group(), pose = new THREE.Group(), body = new THREE.Group(); g.add(pose); pose.add(body);
  const B = (geo, m, p, s, r) => { const o = new THREE.Mesh(geo, m); o.position.set(...p); if (s) o.scale.set(...s); if (r) o.rotation.set(...r); o.castShadow = true; body.add(o); return o; };
  const eye = (m, p, r) => { const e = new THREE.Mesh(new THREE.SphereGeometry(r || .025, 6, 4), m); e.position.set(...p); body.add(e); };
  return { g, pose, body, B, eye };
}
function tail(K, mat, pts, r0, r1, tipM){
  for (let k = 0; k < pts.length; k++) { const t = k / (pts.length - 1); K.B(SPH(r0 + (r1 - r0) * t), k === pts.length - 1 && tipM ? tipM : mat, pts[k]); }
  for (let k = 0; k < pts.length - 1; k++) {
    const a = P.V3(...pts[k]), b = P.V3(...pts[k + 1]), m = a.clone().add(b).multiplyScalar(.5), t = (k + .5) / (pts.length - 1), r = r0 + (r1 - r0) * t;
    const c = K.B(new THREE.CylinderGeometry(r * .92, r * .98, a.distanceTo(b), 12), mat, [m.x, m.y, m.z]);
    c.quaternion.setFromUnitVectors(P.V3(0, 1, 0), b.clone().sub(a).normalize());

P.kangaroo = (o = {}) => {
  const R = P.rng(o.seed || 1), K = kit(), base = P.lin(o.fur || '#8c7766').offsetHSL(0, (R() - .5) * .05, (R() - .5) * .06);
  const fur = sm(base), lt = sm(o.belly || '#dccdb9'), dk = sm('#4a3d33'), pink = sm('#c99a8e'), nose = sm('#2a2422', { roughness: .4 }), eyeM = sm('#1b120b', { roughness: .3 });
  K.B(SPH(.32), fur, [0, .5, -.12], [1, .95, 1.15]); [-1, 1].forEach(s => K.B(SPH(.2), fur, [s * .17, .42, -.04], [.75, 1.15, 1.3]));
  K.B(SPH(.27), fur, [0, .86, .05], [.86, 1.38, .86], [.38, 0, 0]); K.B(SPH(.2), lt, [0, .84, .17], [.72, 1.25, .55], [.38, 0, 0]);
  const head = new THREE.Group(); head.position.set(0, 1.17, .17); K.body.add(head);
  const H = (geo, m, p, s, r) => { const x = K.B(geo, m, [p[0], p[1] - 1.17, p[2] - .17], s, r); K.body.remove(x); head.add(x); return x; };
  H(SPH(.12), fur, [0, 1.17, .17], [.82, 1.25, .85], [.25, 0, 0]); H(SPH(.13), fur, [0, 1.32, .24], [.86, .9, 1.12]); H(SPH(.085), lt, [0, 1.28, .38], [.82, .72, 1.35]);
  H(SPH(.034), nose, [0, 1.3, .49], [1.2, .8, .7]); H(SPH(.03), lt, [0, 1.22, .36], [1.3, .6, 1]);
  [-1, 1].forEach(s => {
    H(SPH(.075), fur, [s * .075, 1.5, .2], [.55, 1.65, .25], [0, 0, s * -.22]); H(SPH(.06), pink, [s * .074, 1.49, .218], [.42, 1.35, .12], [0, 0, s * -.22]);
    H(new THREE.SphereGeometry(.024, 6, 4), eyeM, [s * .072, 1.36, .335]);

<script data-pe="lib/models/vehicles/jet-plane.js">
/* ==== PPL jet plane: a narrow-body airliner in proportion (3d, low-poly) ====
   Approved by Paul for Quokka Cafe's airport (Oct 2026): slim fuselage, low swept wings with slight dihedral, engines on pylons,
   swept fin and tailplane, nose and main gear, nav lights. Fictional airline name only.
   PPL.jetPlane({tail:'#2a9a8a', name:'QUOKKA AIR'}) -> Group, nose along +x, ~8.6 long (Quokka game units). */

P.jetPlane = (o = {}) => {

  const L = 8.6, R = .42, Y = 1.05;
  put(C(R, R, L - 2.6), W, .1, Y, 0, 0, 0, Math.PI / 2);
  put(new THREE.SphereGeometry(R, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), W, L / 2 - 1.2, Y, 0, 0, 0, -Math.PI / 2, [1, 2.6, 1]);

  [1, -1].forEach(s => { put(wingGeo(1.7, .45, 3.9, 1.5, .07), W, .35, Y - .25, 0, s * .06, 0, 0, [1, 1, s]);

<script data-pe="lib/models/flora/aussie-flora.js">
/* ==== PPL Australian flora & rocks (geometry builders; one draw call each with vertex colours) ====
   Each returns a BufferGeometry (cached per seed). Place many with PPL.scatter(geo, points).
   PPL.gumGeo(seed)        eucalyptus / marri: pale trunk, open clumpy crown       ~14 m
   PPL.peppermintGeo(seed) WA peppermint: dark trunk, weeping layered crown        ~7 m
   PPL.grassTreeGeo(seed)  grass tree: black trunk, green skirt, spike             ~2.2 m
   PPL.heathGeo(seed)      coastal heath shrub, grey-green dome                    ~1 m
   PPL.tussockGeo(seed)    tussock grass clump                                     ~0.5 m
   PPL.turfGeo(seed)       short green rough-grass clump                       ~0.25 m
   PPL.boulderGeo(seed)    granite boulder, lichen speckles                        ~1 m (scale it)  */
(function(){
const P = window.PPL, C = {};
const cache = (k, f) => C[k] || (C[k] = f());
const blob = (R, cols, x, y, z, s, sy, det = 1) => P.shadeY(P.paint(P.tr(new THREE.IcosahedronGeometry(1, det), x, y, z, s * (0.85 + R() * .3), s * (sy || .7), s * (0.85 + R() * .3), 0, R() * 6), cols, .12, (R() * 1e6) | 0), .62, 1.18);
const branch = (R, cols, x0, y0, z0, x1, y1, z1, r0, r1) => {
  const a = P.V3(x0, y0, z0), b = P.V3(x1, y1, z1), len = a.distanceTo(b);
  const g = new THREE.CylinderGeometry(r1, r0, len, 6); g.translate(0, len / 2, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(P.V3(0, 1, 0), b.clone().sub(a).normalize());
  g.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(q)); g.translate(x0, y0, z0);
  return P.paint(g, cols, .08, (R() * 1e6) | 0);
};
P.gumGeo = (seed = 1) => cache('gum' + seed, () => {
  const R = P.rng(seed), L = [], bark = ['#d9d2c2', '#cfc6b2', '#e4ddcd', '#b9ad96'], leaf = ['#5a6b4f', '#66775a', '#4e5e45', '#72825f', '#5f6a44'];
  const H = 9 + R() * 6; L.push(branch(R, bark, 0, 0, 0, (R() - .5) * 1.2, H * .55, (R() - .5) * 1.2, .45, .3));
  const top = P.V3(0, H * .55, 0);
  const nb = 4 + (R() * 3 | 0);
  for (let i = 0; i < nb; i++) {
    const a = i / nb * 6.28 + R(), r = 2 + R() * 3.5, y = H * (.75 + R() * .25);
    const ex = Math.cos(a) * r, ez = Math.sin(a) * r;
    L.push(branch(R, bark, top.x, top.y, top.z, ex, y, ez, .26, .1));
    const n = 3 + (R() * 3 | 0);
    for (let k = 0; k < n; k++) L.push(blob(R, leaf, ex + (R() - .5) * 2.6, y + (R() - .2) * 1.8, ez + (R() - .5) * 2.6, 1.2 + R() * 1.1, .8));
  }
  return P.merge(L);
});
P.peppermintGeo = (seed = 1) => cache('pep' + seed, () => {
  const R = P.rng(seed), L = [], bark = ['#4b3b2e', '#5a4636', '#3e3027'], leaf = ['#34502a', '#3e5c30', '#2e4724', '#4a6a36'];
  const lean = (R() - .5) * .8; L.push(branch(R, bark, 0, 0, 0, lean, 2.6, (R() - .5) * .6, .28, .18));
  for (let i = 0; i < 4; i++) { const a = i * 1.7 + R(), r = 1.4 + R() * 1.3; L.push(branch(R, bark, lean, 2.5, 0, lean + Math.cos(a) * r, 4 + R() * 1.4, Math.sin(a) * r, .14, .06)); }
  for (let k = 0; k < 22; k++) { // dense rounded crown that droops at the rim
    const a = R() * 6.28, r = Math.sqrt(R()) * 3.2, y = 4.4 + (1 - r / 3.2) * 2.2 - r * .25 + R() * .6;
    L.push(blob(R, leaf, lean + Math.cos(a) * r, y, Math.sin(a) * r, 1 + R() * .6, .75));
  }
  return P.merge(L);
});
P.grassTreeGeo = (seed = 1) => cache('gt' + seed, () => {
  const R = P.rng(seed), L = [], h = .7 + R() * .9;
  L.push(P.paint(P.tr(new THREE.CylinderGeometry(.16, .22, h, 8), 0, h / 2, 0), ['#211b17', '#2b241f'], .1, seed));
  for (let k = 0; k < 70; k++) { // fountain of thin leaves
    const a = R() * 6.28, tilt = .25 + R() * 1.15, len = .9 + R() * .5;
    const c = new THREE.ConeGeometry(.018, len, 3); c.translate(0, len / 2, 0); c.rotateZ(tilt); c.rotateY(a); c.translate(0, h, 0);
    L.push(P.paint(c, tilt > 1.1 ? ['#9a8a56', '#8a7a4a'] : ['#6f8a3c', '#7d9846', '#5f7a32'], .1, k + seed * 99));
  }
  if (R() < .6) L.push(P.paint(P.tr(new THREE.CylinderGeometry(.02, .035, 1.6, 5), 0, h + .8, 0), ['#5a4a32'], 0, seed), P.paint(P.tr(new THREE.CylinderGeometry(.045, .045, .7, 6), 0, h + 1.35, 0), ['#6b5a3c', '#7a6a4a'], .1, seed));
  return P.merge(L);
});
P.heathGeo = (seed = 1) => cache('heath' + seed, () => {
  const R = P.rng(seed), L = [], cols = R() < .5 ? ['#7d8c6a', '#8a9a74', '#6f7e5e'] : ['#5f6e4a', '#6c7b55', '#56653f'];
  for (let k = 0; k < 6; k++) L.push(blob(R, cols, (R() - .5) * .9, .35 + R() * .3, (R() - .5) * .9, .35 + R() * .3, .75, 0));
  if (R() < .35) for (let k = 0; k < 8; k++) L.push(P.paint(P.tr(new THREE.IcosahedronGeometry(.05, 0), (R() - .5) * 1, .55 + R() * .35, (R() - .5) * 1), [R() < .5 ? '#e8c43a' : '#f0f0e8'], 0, k));
  return P.merge(L);

P.tussockGeo = (seed = 1) => cache('tus' + seed, () => {
  const R = P.rng(seed), L = [];
  for (let k = 0; k < 22; k++) {
    const a = R() * 6.28, tilt = R() * .7, len = .35 + R() * .3;
    const c = new THREE.ConeGeometry(.02, len, 3); c.translate(0, len / 2, 0); c.rotateZ(tilt); c.rotateY(a);
    L.push(P.paint(c, ['#a8a46a', '#9a9a5e', '#b8b07a', '#8a8f55'], .1, k + seed * 31));
  }
  return P.merge(L);
});
P.turfGeo = (seed = 1) => cache('turf' + seed, () => { // short green rough-grass clump, ~0.25 m
  const R = P.rng(seed), L = [];
  for (let k = 0; k < 9; k++) { const a = R() * 6.28, tilt = .15 + R() * .5, len = .16 + R() * .14;
    const c = new THREE.ConeGeometry(.025, len, 3); c.translate(0, len / 2, 0); c.rotateZ(tilt); c.rotateY(a); c.translate((R() - .5) * .15, 0, (R() - .5) * .15);
    L.push(P.shadeY(P.paint(c, ['#4f7a30', '#5b8838', '#466e2a', '#6f8a3e'], .08, k + seed * 13), .7, 1.15)); }
  return P.merge(L);
});
P.boulderGeo = (seed = 1) => cache('rock' + seed, () => {
  const R = P.rng(seed), g = new THREE.IcosahedronGeometry(1, 2), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const v = P.V3(p.getX(i), p.getY(i), p.getZ(i)), n = 1 + .22 * P.fbm(v.x * 1.3 + seed, v.y * 1.3 + v.z, 3);
    v.multiplyScalar(n); v.y = v.y > 0 ? v.y * .75 : v.y * .4; p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return P.paint(g, ['#9a948a', '#a8a298', '#8c867c', '#b3ab9c', '#7f8c6a'], .1, seed);
});
/* instanced placement: points = [{x,y,z,s,ry}] */
/* tint: {h, s, l} random jitter per instance so a stand of trees is never one flat colour */
P.scatter = (geo, points, mat, opt = {}) => {
  const m = new THREE.InstancedMesh(geo, mat || P.vmat({ roughness: .9 }), points.length), o = new THREE.Object3D(), R = P.rng(opt.seed || 7), c = new THREE.Color();
  points.forEach((p, i) => { o.position.set(p.x, p.y, p.z); o.rotation.set(0, p.ry || 0, 0); o.scale.setScalar(p.s || 1); o.updateMatrix(); m.setMatrixAt(i, o.matrix);
    if (opt.tint) { const t = opt.tint; c.setHSL(0, 0, 1); c.setRGB(1, 1, 1); const l = 1 + (R() - .5) * 2 * (t.l || 0); c.setRGB(l * (1 + (R() - .5) * (t.h || 0)), l, l * (1 + (R() - .5) * (t.h || 0) * .6)); m.setColorAt(i, c); } });

['gumGeo', 'peppermintGeo', 'grassTreeGeo', 'heathGeo', 'tussockGeo', 'turfGeo', 'boulderGeo'].forEach(id => P.reg(id, { group: 'models/flora', from: 'new (golf)' }));
})();

<script data-pe="lib/models/flora/lowpoly-garden.js">
/* ==== PPL low-poly garden set (3d, flat-shaded) ====
   From Paul's reference sheets (Oct 2026): 30 garden plants built from faceted leaves, petals and clumps.
   PPL.LP_GARDEN[id].make(opts) -> THREE.Group sitting on y=0, about 1 unit tall (trees ~3).
   opts: {seed, scale, colour} — colour overrides the main flower or leaf colour where it makes sense.
   Note: Quokka Cafe draws its plants as pixel sprites; these models are for the low-poly games (Magpie, golf, new games). */
(function(){
const P = window.PPL;
const FLAT = {}; const fm = (c, o) => { const k = c + JSON.stringify(o || {}); if (FLAT[k]) return FLAT[k]; const m = new THREE.MeshStandardMaterial(Object.assign({ roughness: .78, metalness: 0, flatShading: true }, o || {})); m.color = P.lin(c); return FLAT[k] = m; };
const rng = s => { s = (s | 0) || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; };
const G = () => new THREE.Group();
const mesh = (geo, mat, g) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; if (g) g.add(m); return m; };
const GREEN = ['#3f9a3a', '#58b844', '#7ccc4c', '#2f8a46', '#4caa3c', '#9ad84e'];
const tint = (r, a) => a[(r() * a.length) | 0];

/* a faceted leaf: a folded diamond (midrib crease), length along +y, width on x, the crease lifts on z */
function leafGeo(len, wid, fold = .35, tipBend = 0) {
  const v = [0, 0, 0, -wid / 2, len * .42, wid * fold * .2, 0, len * .5, wid * fold, wid / 2, len * .42, wid * fold * .2, 0, len, len * tipBend,
             -wid * .32, len * .75, wid * fold * .1 + len * tipBend * .5, wid * .32, len * .75, wid * fold * .1 + len * tipBend * .5];
  const idx = [0, 1, 2, 0, 2, 3, 1, 5, 2, 2, 5, 4, 2, 4, 6, 2, 6, 3];
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3)); g.setIndex(idx); g.computeVertexNormals(); return g; }
const DS = THREE.DoubleSide;
/* place a leaf: from (x,y,z), pointing with yaw (around y) and tilt (from vertical) */
function leaf(g, len, wid, col, x, y, z, yaw, tilt, o = {}) { const m = mesh(leafGeo(len, wid, o.fold == null ? .35 : o.fold, o.bend || 0), fm(col, { side: DS }), null); const h = G(); h.position.set(x, y, z); h.rotation.y = yaw; m.rotation.x = tilt; h.add(m); g.add(h); return h; }
/* a lumpy faceted ball */
function blob(r, detail = 0, seed = 1, jit = .18) { const geo = new THREE.IcosahedronGeometry(r, detail); const p = geo.attributes.position, rr = rng(seed), seen = new Map();
  for (let i = 0; i < p.count; i++) { const k = p.getX(i).toFixed(3) + p.getY(i).toFixed(3) + p.getZ(i).toFixed(3); let s = seen.get(k); if (s == null) { s = 1 + (rr() - .5) * jit * 2; seen.set(k, s); } p.setXYZ(i, p.getX(i) * s, p.getY(i) * s, p.getZ(i) * s); }
  geo.computeVertexNormals(); return geo; }
/* a five-petal daisy facing up (tilt tips it) */
function daisy(g, x, y, z, r, petal, centre = '#f2b02a', tilt = 0, yaw = 0, n = 5) { const h = G(); h.position.set(x, y, z); h.rotation.set(tilt, yaw, 0);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const m = mesh(new THREE.CylinderGeometry(r * .5, r * .22, r * .12, 5), fm(petal), h); m.position.set(Math.cos(a) * r * .62, 0, Math.sin(a) * r * .62); m.rotation.y = -a; m.scale.set(1.2, 1, .72); }
  const c = mesh(new THREE.DodecahedronGeometry(r * .3, 0), fm(centre), h); c.position.y = r * .06; c.scale.y = .7; g.add(h); return h; }
const stem = (g, x1, y1, z1, x2, y2, z2, r, col) => { const a = new THREE.Vector3(x1, y1, z1), b = new THREE.Vector3(x2, y2, z2), L = a.distanceTo(b); const m = mesh(new THREE.CylinderGeometry(r * .7, r, L, 5), fm(col), g); m.position.copy(a).add(b).multiplyScalar(.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize()); return m; };
/* a pinnate frond (fern): a curved stem with leaflet pairs shrinking to the tip */
function frond(g, len, col, yaw, tilt, seed) { const h = G(); h.rotation.set(0, yaw, 0); g.add(h); const n = 9, r = rng(seed); let px = 0, py = 0, pz = 0;
  for (let i = 0; i < n; i++) { const t = i / n, ang = tilt + t * .9, seg = len / n, nx = px, ny = py + Math.cos(ang) * seg, nz = pz + Math.sin(ang) * seg;
    stem(h, px, py, pz, nx, ny, nz, .012, '#4a8a2a'); const s = (1 - t) * .9 + .2;
    [-1, 1].forEach(sd => leaf(h, len * .22 * s, len * .1 * s, col, nx, ny, nz, sd * 1.4, ang + .3, { fold: .2 })); px = nx; py = ny; pz = nz; }
  leaf(h, len * .12, len * .05, col, px, py, pz, 0, tilt + .9, { fold: .2 }); return h; }
/* a lily pad: a flat faceted disc with a notch */
function pad(g, r, col, x, z, rot) { const s = new THREE.Shape(); const n = 12, gap = .5; s.moveTo(0, 0); for (let i = 0; i <= n; i++) { const a = gap / 2 + i / n * (Math.PI * 2 - gap); s.lineTo(Math.cos(a) * r, Math.sin(a) * r); } s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: r * .08, bevelEnabled: false }); geo.rotateX(-Math.PI / 2); const m = mesh(geo, fm(col), g); m.position.set(x, 0, z); m.rotation.y = rot || 0;
  const top = mesh(new THREE.CircleGeometry(r * .5, 6, gap / 2, Math.PI * 2 - gap), fm('#7ccc4c'), g); top.rotation.x = -Math.PI / 2; top.position.set(x, r * .081, z); top.rotation.z = rot || 0; return m; }
/* ivy leaf: a five-point star, flat */
function ivyLeaf(g, r, col, x, y, z, yaw, tilt) { const s = new THREE.Shape(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i / 10 * Math.PI * 2, rr = i % 2 ? r * .5 : r * (i === 0 ? 1.15 : 1); const px = Math.cos(a) * rr, py = Math.sin(a) * rr; i ? s.lineTo(px, py) : s.moveTo(px, py); } s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: r * .06, bevelEnabled: false }); const m = mesh(geo, fm(col), null); const h = G(); h.position.set(x, y, z); h.rotation.set(tilt || 0, yaw || 0, 0); h.add(m); g.add(h); return h; }

   - Asset registry: PE.reg(id, def), PE.make(id, opts). Every asset is sized in metres (people 1.7 m, cars ~4.4 m).

PE.assets = {};
PE.CATS = [
  ['ground', 'พื้น'], ['building', 'อาคาร'], ['service', 'จุดบริการ'], ['nature', 'ต้นไม้'], ['garden', 'สวน'],
  ['prop', 'ของตกแต่ง'], ['vehicle', 'ยานพาหนะ'], ['people', 'คนและสัตว์'], ['marker', 'จุดระบบ']];

const prof = pts => { const s = new T.Shape(); s.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => s.lineTo(p[0], p[1])); return s; };
PE.car = (type, color, tuned) => {
  const C0 = CARS[type] || CARS.sedan, g = G(), bodyM = P.mat(color, { roughness: .45, metalness: .25 }), glass = P.mat('#1d2433', { roughness: .15 }), dark = P.mat('#18181c');
  const ex = (pts, depth, mat, y = 0) => { const geo = new T.ExtrudeGeometry(prof(pts), { depth, bevelEnabled: false }); const m = new T.Mesh(geo, mat); m.position.set(0, y, -depth / 2); m.castShadow = true; g.add(m); return m; };

  let i = 0; const next = () => { const el = $('#shelf').querySelector('[data-th]'); if (!el) return; const id = el.dataset.th; try { const img = new Image(); img.alt = ''; img.src = PE.thumb(id, 120); el.replaceWith(img); } catch (e) { el.removeAttribute('data-th'); } if (++i < 200) setTimeout(next, 0); }; next();
}
$('#cats').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; cat = b.dataset.cat; drawCats(); drawShelf(); };
$('#shelf').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; cur = b.dataset.a; setTool('place'); drawShelf(); makeGhost(); if (innerWidth <= 900) $('#left').classList.remove('open'); };
/* ---------- tools ---------- */
function setTool(t) { tool = t; document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t)); if (t !== 'place') clearGhost(); else makeGhost(); if (t !== 'path') endPath(false); hint(); }
document.querySelector('.tools').onclick = e => { const b = e.target.closest('[data-tool]'); if (b) setTool(b.dataset.tool); };
function hint() {
  const h = { select: '<b>เลือก·ย้าย</b> แตะของเพื่อเลือก ลากของที่เลือกเพื่อย้าย · ลากพื้นเพื่อเลื่อนกล้อง · R หมุน · Delete ลบ · Ctrl+D ทำซ้ำ',
    place: cur ? `<b>วาง: ${PE.assets[cur].name}</b> แตะพื้นเพื่อวาง${PE.assets[cur].cat === 'ground' ? ' (ลากเพื่อระบายพื้นต่อกัน)' : ''} · R หมุน · Esc เลิก` : 'เลือกของจากชั้นซ้ายก่อน',
    path: `<b>ทางเดิน</b> แตะพื้นทีละจุด (${pathPts.length} จุด) · Enter จบเส้น · Esc ยกเลิก` };
  $('#hint').innerHTML = h[tool];
}
function makeGhost() { clearGhost(); if (!cur || tool !== 'place') return; ghost = PE.make(cur, {}); ghost.traverse(m => { if (m.isMesh) m.castShadow = false; }); ghost.rotation.y = ghostRot * Math.PI / 2; ghost.visible = false; W.scene.add(ghost); W.dirty = true; }
function clearGhost() { if (ghost) { W.scene.remove(ghost); ghost = null; W.dirty = true; } }
const snapTo = (v, s) => Math.round(v / s) * s;
function snapPos(p, id) { const s = (PE.assets[id] && PE.assets[id].snap) || .5; return [snapTo(p.x, s), snapTo(p.z, s)]; }
/* ---------- selection ---------- */
function select(n) {
  sel = n; if (selBox) { W.scene.remove(selBox); selBox = null; }
  if (n) { selBox = new T.BoxHelper(n, 0x9be02f); selBox.material.toneMapped = false; selBox.userData.noId = true; W.scene.add(selBox); }
  drawInsp(); W.dirty = true;
}
function drawInsp() {
  const el = $('#insp'); if (!sel) { el.innerHTML = `<h3>ของที่เลือก</h3><p class="mono" style="margin:0">ยังไม่ได้เลือก · ใช้เครื่องมือ "เลือก·ย้าย" แล้วแตะของในฉาก</p>`; return; }
  const s = sel.userData.spec, d = PE.assets[s.a];
  el.innerHTML = `<h3>ของที่เลือก</h3><div class="f"><span>ชนิด</span><span>${d.name}<br><span class="mono">${d.id}${d.role ? ' · ' + d.role : ''}</span></span>
    <span>ตำแหน่ง</span><span class="mono">x ${(+s.x).toFixed(1)} · z ${(+s.z).toFixed(1)}</span>
    ${d.tint ? `<span>สี</span><div class="sw">${(d.colors || ['#ffffff', '#d43a2c', '#2f73b0', '#3f8f3c', '#e9b62c', '#18181c']).map(c => `<button style="background:${c}" data-col="${c}" class="${(s.c || (d.defaults || {}).c) === c ? 'on' : ''}" aria-label="สี ${c}"></button>`).join('')}<input type="color" id="iCol" value="${s.c || (d.defaults || {}).c || '#ffffff'}" style="width:28px;height:22px;border:2px solid var(--rule);padding:0;background:none"></div>` : ''}
    ${d.text ? `<span>ข้อความ</span><input type="text" id="iTxt" value="${(s.t || (d.defaults || {}).t || '').replace(/"/g, '&quot;')}">` : ''}
    <span>ขนาด</span><input type="range" id="iScale" min=".5" max="2.5" step=".1" value="${s.s || 1}"></div>
    <div class="row" style="margin-top:8px"><button class="b" id="iRot">หมุน 90°</button><button class="b" id="iDup">ทำซ้ำ</button><button class="b" id="iDel" style="border-color:var(--red)">ลบ</button></div>`;
  el.querySelectorAll('[data-col]').forEach(b => b.onclick = () => patch({ c: b.dataset.col }));
  const ic = $('#iCol'); if (ic) ic.onchange = () => patch({ c: ic.value });
  const it = $('#iTxt'); if (it) it.onchange = () => patch({ t: it.value });
  $('#iScale').onchange = e => patch({ s: +e.target.value });
  $('#iRot').onclick = () => patch({ r: ((sel.userData.spec.r || 0) + 1) % 4 }); $('#iDup').onclick = dup; $('#iDel').onclick = del;
}
function patch(p) { if (!sel) return; snap(); const m = W.update(sel, p); select(m); }
function del() { if (!sel) return; snap(); W.remove(sel); select(null); syncScene(); }
function dup() { if (!sel) return; snap(); const s = Object.assign({}, sel.userData.spec); s.x += 2; s.z += 2; select(W.add(s)); }
/* ---------- paths ---------- */
function drawPathLine() {
  if (pathLine) { W.scene.remove(pathLine); pathLine = null; } if (pathPts.length < 1) { W.dirty = true; return; }
  const g = new T.BufferGeometry().setFromPoints(pathPts.map(p => new T.Vector3(p[0], .15, p[1]))); pathLine = new T.Line(g, new T.LineBasicMaterial({ color: 0x58e1ff, toneMapped: false })); pathLine.userData.noId = true; W.scene.add(pathLine); W.dirty = true;
}
function endPath(keep) { if (keep && pathPts.length >= 2) { snap(); W.paths.push({ kind: $('#pKind') ? $('#pKind').value : 'walk', pts: pathPts.slice(), n: 3 }); W.spawnMovers(); toast('เพิ่มเส้นทางแล้ว'); } pathPts = []; drawPathLine(); drawPaths(); hint(); }
function drawPaths() {
  $('#paths').innerHTML = W.paths.map((p, i) => `<div class="pathrow"><span class="mono">#${i + 1}</span><select data-pk="${i}"><option value="walk"${p.kind === 'walk' ? ' selected' : ''}>คนเดิน</option><option value="car"${p.kind === 'car' ? ' selected' : ''}>รถ</option><option value="animal"${p.kind === 'animal' ? ' selected' : ''}>สัตว์</option></select><input type="number" min="1" max="12" value="${p.n || 3}" data-pn="${i}" aria-label="จำนวน" style="width:44px"><button class="b" data-pd="${i}" aria-label="ลบเส้นทาง">✕</button></div>`).join('')
    + (tool === 'path' ? `<div class="row"><select id="pKind" class="b"><option value="walk">คนเดิน</option><option value="car">รถ</option><option value="animal">สัตว์</option></select><button class="b" id="pEnd">จบเส้น (${pathPts.length})</button></div>` : '');
  const pe = $('#pEnd'); if (pe) pe.onclick = () => endPath(true);
}
$('#paths').addEventListener('change', e => { const k = e.target.dataset.pk, n = e.target.dataset.pn; if (k !== undefined) { snap(); W.paths[k].kind = e.target.value; W.spawnMovers(); } if (n !== undefined) { snap(); W.paths[n].n = +e.target.value; W.spawnMovers(); } });
$('#paths').addEventListener('click', e => { const d = e.target.closest('[data-pd]'); if (d) { snap(); W.paths.splice(+d.dataset.pd, 1); W.spawnMovers(); drawPaths(); } });
/* ---------- scene panel ---------- */
function syncScene() {
  $('#sName').value = (W.meta && W.meta.name) || 'ฉากใหม่'; $('#gW').value = W.groundSize[0]; $('#gD').value = W.groundSize[1]; $('#gC').value = W.groundColor;
  $('#tS').value = W.time; $('#tL').textContent = fmtT(W.time); $('#sMode').value = W.mode; $('#sPal').value = W.palette; $('#sOut').checked = W.outline; $('#sDit').checked = W.dither;
  $('#sTpl').value = (W.meta && W.meta.template) || 'shop'; $('#vMode').classList.toggle('on', W.mode === 'pixel'); drawPaths(); gameInfo();
}
function gameInfo() { const pts = W.nodes.filter(n => ['counter', 'pump'].includes(PE.assets[n.userData.asset].role)).length, sp = W.nodes.filter(n => PE.assets[n.userData.asset].role === 'spawn').length;
  $('#gameInfo').textContent = pts ? `จุดบริการ ${pts} จุด · จุดลูกค้าเข้า ${sp} จุด${sp ? '' : ' (ไม่มี: ลูกค้าจะมาจากขอบหน้า)'} · ใช้เทมเพลตบริหารร้านได้` : 'ยังไม่มีจุดบริการ: วาง "เคาน์เตอร์ขาย" "คีออส" "แผงขายของ" หรือ "ตู้จ่ายน้ำมัน" จากหมวดจุดบริการ'; }
const fmtT = h => String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.round(h % 1 * 60)).padStart(2, '0');
$('#sName').onchange = e => { W.meta = W.meta || {}; W.meta.name = e.target.value; };
$('#gW').onchange = $('#gD').onchange = () => { snap(); W.setGround(+$('#gW').value || 40, +$('#gD').value || 30); };
$('#gC').oninput = e => W.setGround(W.groundSize[0], W.groundSize[1], e.target.value);
$('#tS').oninput = e => { W.setTime(+e.target.value); $('#tL').textContent = fmtT(W.time); };
$('#sMode').onchange = e => { W.setMode(e.target.value); syncScene(); };
$('#sPal').onchange = e => { W.palette = +e.target.value; W._palDirty = true; W.dirty = true; };
$('#sOut').onchange = e => { W.outline = e.target.checked; W.dirty = true; }; $('#sDit').onchange = e => { W.dither = e.target.checked; W.dirty = true; };
$('#sTpl').onchange = e => { W.meta = W.meta || {}; W.meta.template = e.target.value; };
$('#layers').innerHTML = PE.CATS.map(([k, n]) => `<label><input type="checkbox" data-l="${k}" checked> ${n}</label>`).join('');
$('#layers').onchange = e => { const k = e.target.dataset.l; if (k) W.setHidden(k, !e.target.checked); };
/* ---------- view buttons ---------- */
$('#vRotL').onclick = () => W.turn(-1); $('#vRotR').onclick = () => W.turn(1); $('#vZin').onclick = () => W.zoomBy(1.25); $('#vZout').onclick = () => W.zoomBy(.8);
$('#vMode').onclick = () => { W.setMode(W.mode === 'pixel' ? 'smooth' : 'pixel'); syncScene(); };
$('#mLeft').onclick = () => { $('#right').classList.remove('open'); $('#left').classList.toggle('open'); };
$('#mRight').onclick = () => { $('#left').classList.remove('open'); $('#right').classList.toggle('open'); };
/* ---------- pointer ---------- */
function placeAt(p) {
  const [x, z] = snapPos(p, cur), key = cur + x + ',' + z; if (key === lastPaint) return; lastPaint = key;
  const [gw, gd] = W.groundSize; if (Math.abs(x) > gw / 2 + 2 || Math.abs(z) > gd / 2 + 2) return;
  if (PE.assets[cur].cat === 'ground') { const old = W.nodes.find(n => n.userData.spec.a.startsWith('tile') && Math.abs(n.position.x - x) < .1 && Math.abs(n.position.z - z) < .1); if (old) W.remove(old); }
  W.add({ a: cur, x, z, r: ghostRot }); gameInfo();
}
W.controls(e => {
  const p = W.pickGround(e.clientX, e.clientY);
  if (tool === 'place' && cur && p) { snap(); lastPaint = ''; placeAt(p); PE.sfx.tap(); }
  else if (tool === 'select') { select(W.pickNode(e.clientX, e.clientY)); }
  else if (tool === 'path' && p) { pathPts.push([+p.x.toFixed(1), +p.z.toFixed(1)]); drawPathLine(); drawPaths(); hint(); }
}, {
  ignore: e => e.target.closest('.vbtns,.hint'),
  hover: e => { if (tool === 'place' && ghost) { const p = W.pickGround(e.clientX, e.clientY); if (p) { const [x, z] = snapPos(p, cur); ghost.position.set(x, 0, z); ghost.visible = true; W.dirty = true; } } },
  drag: (e, prev) => {
    if (tool === 'select' && sel) { if (!dragging) { const hit = W.pickNode(prev[0], prev[1]); if (hit !== sel) return false; snap(); dragging = true; } const p = W.pickGround(e.clientX, e.clientY); if (p) { const [x, z] = snapPos(p, sel.userData.spec.a); W.move(sel, x, z); selBox.update(); drawInsp(); } return true; }
    if (tool === 'place' && cur && PE.assets[cur].cat === 'ground') { if (!paint) { snap(); paint = true; lastPaint = ''; } const p = W.pickGround(e.clientX, e.clientY); if (p) placeAt(p); return true; }
    return false;
  },
  dragEnd: () => { dragging = false; paint = false; }
});
addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return; const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'd') { e.preventDefault(); dup(); return; }
  if (k === 'v') setTool('select'); else if (k === 'b') setTool('place'); else if (k === 'p') setTool('path');
  else if (k === 'q') W.turn(-1); else if (k === 'e') W.turn(1);
  else if (k === 'r') { if (tool === 'place') { ghostRot = (ghostRot + 1) % 4; if (ghost) { ghost.rotation.y = ghostRot * Math.PI / 2; W.dirty = true; } } else if (sel) patch({ r: ((sel.userData.spec.r || 0) + 1) % 4 }); }
  else if (k === 'delete' || k === 'backspace') del();
  else if (k === 'enter' && tool === 'path') endPath(true);
  else if (k === 'escape') { if (tool === 'path') endPath(false); else if (tool === 'place') setTool('select'); else select(null); }
});
/* ---------- files ---------- */
function modal(html) { $('#mbox').innerHTML = html; $('#modal').hidden = false; }
$('#modal').onclick = e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) $('#modal').hidden = true; };
function loadScene(s) { snap(); W.load(s); select(null); syncScene(); $('#modal').hidden = true; }
$('#bNew').onclick = () => modal(`<h2>เริ่มจากฉากตัวอย่าง</h2><div class="cards">${Object.entries(PE.SAMPLES).map(([k, s]) => `<button data-s="${k}"><b>${s.name}</b><small>${k === 'blank' ? 'พื้นว่าง วางของเองทั้งหมด' : 'เปิดแล้วกด ▶ เล่นทดสอบได้ทันที'}</small></button>`).join('')}</div><div class="row"><button class="b" data-close>ปิด</button></div>`);
$('#mbox').addEventListener('click', e => {
  const s = e.target.closest('[data-s]'); if (s) loadScene(PE.SAMPLES[s.dataset.s].build());
  const o = e.target.closest('[data-open]'); if (o) { const all = PE.store.get(KEY, {}); if (all[o.dataset.open]) loadScene(all[o.dataset.open]); }
  const d = e.target.closest('[data-del]'); if (d) { const all = PE.store.get(KEY, {}); delete all[d.dataset.del]; PE.store.set(KEY, all); $('#bOpen').click(); }

$('#bSave').onclick = () => { const all = PE.store.get(KEY, {}), s = W.toJSON(); s.name = $('#sName').value || s.name; all[s.name] = s; toast(PE.store.set(KEY, all) ? 'บันทึก "' + s.name + '" ในเบราว์เซอร์นี้แล้ว' : 'บันทึกไม่ได้ในเบราว์เซอร์นี้ ใช้ปุ่ม JSON คัดลอกเก็บแทน'); };
$('#bOpen').onclick = () => { const all = PE.store.get(KEY, {}), ks = Object.keys(all); modal(`<h2>ฉากที่บันทึกไว้</h2>${ks.length ? `<div class="cards">${ks.map(k => `<button data-open="${k.replace(/"/g, '&quot;')}"><b>${k}</b><small>${all[k].objects.length} ชิ้น</small></button>`).join('')}</div><p class="mono">ลบ: ${ks.map(k => `<button class="b" data-del="${k.replace(/"/g, '&quot;')}">${k} ✕</button>`).join(' ')}</p>` : '<p class="mono">ยังไม่มีฉากที่บันทึกในเบราว์เซอร์นี้</p>'}<div class="row"><button class="b" data-close>ปิด</button></div>`); };
$('#bJson').onclick = () => { modal(`<h2>JSON ของฉาก</h2><p class="mono" style="margin:0">คัดลอกไปเก็บ หรือวาง JSON ที่มีแล้วกดโหลด (ใช้ส่งต่อให้ Claude ทำเกมต่อได้)</p><textarea id="jt">${JSON.stringify(W.toJSON(), null, 1).replace(/</g, '&lt;')}</textarea><div class="row"><button class="b" id="jCopy">คัดลอก</button><button class="b main" id="jLoad">โหลด JSON นี้</button><button class="b" data-close>ปิด</button></div>`);
  $('#jCopy').onclick = () => copy($('#jt').value); $('#jLoad').onclick = () => { try { loadScene(JSON.parse($('#jt').value)); toast('โหลดแล้ว'); } catch (e) { toast('JSON ไม่ถูกต้อง: ' + e.message); } }; };
function copy(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('คัดลอกแล้ว'), () => { const ta = $('#jt') || $('#xt'); if (ta) { ta.focus(); ta.select(); } toast('กด Ctrl+C เพื่อคัดลอก'); }); }
/* ---------- export a playable single-file game ---------- */
function gameHtml() {

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>

<script>PE.boot(${JSON.stringify(s).replace(/</g, '\\u003c')}, document.getElementById('game'));<\/script></body></html>`;

$('#bExport').onclick = () => {

    <div class="row"><button class="b main" id="xDl">ดาวน์โหลด .html</button><button class="b" id="xCopy">คัดลอก HTML</button><button class="b" data-close>ปิด</button></div><textarea id="xt" readonly>${html.slice(0, 4000).replace(/</g, '&lt;')}\n…</textarea>
    <p class="mono" style="margin:0">ถ้าดาวน์โหลดไม่ได้ (บางหน้าต่างบล็อกไว้) ให้เปิดตัวแก้ฉากจากลิงก์ GitHub Pages หรือกดคัดลอก HTML ไปวางในไฟล์</p>`);
  $('#xDl').onclick = () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = (($('#sName').value || 'game').replace(/[^\w฀-๿-]+/g, '-')) + '.html'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { toast('ดาวน์โหลดไม่ได้ในหน้านี้'); } };
  $('#xCopy').onclick = () => (navigator.clipboard ? navigator.clipboard.writeText(html) : Promise.reject()).then(() => toast('คัดลอก HTML แล้ว'), () => toast('คัดลอกไม่ได้ในหน้านี้'));

/* ---------- play test ---------- */
let game = null;
$('#bPlay').onclick = () => {
  const s = W.toJSON(); s.name = $('#sName').value || s.name; const host = document.createElement('div'); host.id = 'play'; document.body.appendChild(host);
  W.stop(); game = PE.boot(s, host); const x = document.createElement('button'); x.className = 'b'; x.id = 'playX'; x.textContent = '■ กลับไปแก้ฉาก'; document.body.appendChild(x);

/* ---------- misc ---------- */

function loop() { W.run(); }

if (location.hash === '#debug') window.__ed = { W, PE, select, setTool };
})();
