<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Roo Point Links</title>
<meta name="description" content="หลุมกอล์ฟทดลองบนภูมิประเทศจริงชายฝั่งตะวันตกของออสเตรเลีย มีจิงโจ้บนแฟร์เวย์และนกแม็กพายจอมขโมยลูก">
<meta name="theme-color" content="#14202a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fffaf0;--glass:rgba(16,24,30,.55);--line:rgba(255,255,255,.18);--gold:#ffcf5a;--green:#7fd36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#14202a;font-family:Kanit,system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.card{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:9px 13px;font-size:14px;line-height:1.35;max-width:62vw}
#hud b{font-weight:800;font-size:16px}
#hud .sub{opacity:.85;font-size:13px}
#topr{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn{font:600 14px Kanit,sans-serif;color:var(--ink);padding:8px 12px;cursor:pointer}
.btn:active{transform:scale(.96)}
#wind{display:flex;align-items:center;gap:8px;padding:7px 11px;font-size:13px}
#wind svg{width:22px;height:22px;transition:transform .3s}
#bottom{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-left))}
#clubs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
.cl{font:600 13px Kanit,sans-serif;color:var(--ink);background:rgba(255,255,255,.08);border:1.5px solid transparent;border-radius:10px;padding:5px 8px;min-width:70px;text-align:left;cursor:pointer;line-height:1.15}
.cl small{display:block;font-weight:400;font-size:11px;opacity:.8}
.cl.on{background:var(--gold);color:#2a1d00;border-color:#fff8}
#mapWrap{padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center}
#mini{width:76px;height:200px;border-radius:8px;display:block}
#topBtn.on{background:var(--gold);color:#2a1d00}
#pred{font-size:11px;opacity:.9;text-align:center;line-height:1.2}
@media (max-height:620px){#mini{height:140px;width:56px}}
#club small{display:block;font-weight:400;opacity:.8;font-size:11px}
#shootWrap{display:flex;align-items:flex-end;gap:10px}
#meter{width:16px;height:150px;border-radius:9px;position:relative;overflow:hidden;padding:0}
#meter i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#7fd36a,#ffcf5a 70%,#ff6a4a)}
#meter s{position:absolute;left:0;right:0;bottom:84%;height:2px;background:#fff;opacity:.7}
#shoot{width:96px;height:96px;border-radius:50%;font:800 22px Kanit,sans-serif;color:#1d2a12;background:radial-gradient(circle at 35% 30%,#d8ff9a,#7fd36a 60%,#4c9a3c);border:3px solid rgba(255,255,255,.75);box-shadow:0 6px 20px rgba(0,0,0,.35);cursor:pointer}
#shoot.dis{filter:grayscale(.8) brightness(.7)}
#tip{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 178px);transform:translateX(-50%);font-size:12px;opacity:.8;padding:5px 10px;white-space:nowrap}
#toast{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.9);font:800 26px Kanit,sans-serif;text-align:center;padding:12px 22px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;font:400 14px Kanit,sans-serif;opacity:.9}
.over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,16,22,.25),rgba(10,16,22,.75));transition:opacity .5s}
.over.hide{opacity:0;pointer-events:none}
.panel{text-align:center;padding:26px 30px;max-width:min(92vw,440px)}
.panel h1{margin:0;font:800 clamp(34px,9vw,52px)/1 Kanit,sans-serif;letter-spacing:.5px;color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.45)}
.panel h1 span{color:var(--gold)}
.panel p{margin:10px 0 0;opacity:.9;font-size:15px}
.panel .go{margin-top:20px;font-size:18px;padding:12px 26px;border-radius:30px;background:var(--gold);color:#2a1d00;border:0;font-weight:800}
.panel .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#credit{position:fixed;left:50%;transform:translateX(-50%);bottom:4px;font-size:10px;opacity:.55;white-space:nowrap;pointer-events:none}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#14202a;font-size:16px;z-index:9}
@media (max-height:520px){#meter{height:110px}#shoot{width:80px;height:80px;font-size:19px}#tip{display:none}}
</style>
</head>
